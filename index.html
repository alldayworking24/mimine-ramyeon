<script>;(async()=>{
/* Calendar-backed reminders. Pure functions never write expenses or move money. */
const PAYMENT_CARD_COMPANIES=['신한카드','삼성카드','현대카드','KB국민카드','롯데카드','우리카드','하나카드','NH농협카드','BC카드','IBK기업카드','씨티카드'];
const PAYMENT_HOLIDAYS={
 2026:['01-01','02-16','02-17','02-18','03-01','03-02','05-01','05-05','05-24','05-25','06-03','06-06','07-17','08-15','08-17','09-24','09-25','09-26','10-03','10-05','10-09','12-25'],
 2027:['01-01','02-06','02-07','02-08','02-09','03-01','05-01','05-03','05-05','05-13','06-06','07-17','07-19','08-15','08-16','09-14','09-15','09-16','10-03','10-04','10-09','10-11','12-25','12-27']
};
const PAYMENT_CALENDAR_CHECKED='2026-11-03';
function paymentIso(date){return date.toISOString().slice(0,10);}
function paymentAddDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return paymentIso(d);}
function paymentMonthShift(ym,n){const [y,m]=ym.split('-').map(Number);return paymentIso(new Date(Date.UTC(y,m-1+n,1))).slice(0,7);}
function paymentMonthEnd(ym){const[y,m]=ym.split('-').map(Number);return paymentIso(new Date(Date.UTC(y,m,0)));}
function paymentValidDate(date){return typeof date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number.isFinite(Date.parse(date+'T12:00:00Z'))&&paymentIso(new Date(date+'T12:00:00Z'))===date;}
function paymentCardName(text){
 const raw=String(text||'').trim(),s=raw.replace(/\s|[()㈜]|주식회사/g,'').toUpperCase();
 const names=[['신한','신한카드'],['삼성','삼성카드'],['현대','현대카드'],['국민','KB국민카드'],['KB','KB국민카드'],['롯데','롯데카드'],['우리','우리카드'],['하나','하나카드'],['농협','NH농협카드'],['NH','NH농협카드'],['비씨','BC카드'],['BC','BC카드'],['기업','IBK기업카드'],['IBK','IBK기업카드'],['씨티','씨티카드']];
 return names.find(([key])=>s.includes(key))?.[1]||raw;
}
function paymentNextBusinessDay(nominal,closedDays=[]){
 let date=nominal,verified=true;const extra=new Set(closedDays);
 for(let i=0;i<40;i++){
  const y=Number(date.slice(0,4)),w=new Date(date+'T12:00:00Z').getUTCDay();
  if(!PAYMENT_HOLIDAYS[y])verified=false;
  if(w!==0&&w!==6&&!PAYMENT_HOLIDAYS[y]?.includes(date.slice(5))&&!extra.has(date))return{date,adjusted:date!==nominal,verified};
  date=paymentAddDays(date,1);
 }
 throw new Error('납부일을 계산하지 못했습니다. 임시휴일 설정을 확인해 주세요.');
}
function paymentValidateConfig(config){
 if(!config||!Array.isArray(config.rules)||config.rules.length>50)throw new Error('납부 항목은 최대 50개까지 등록할 수 있습니다.');
 const ids=new Set(),matches=new Set();
 const rules=config.rules.map(raw=>{
  const r={id:String(raw.id||''),type:String(raw.type||''),name:String(raw.name||'').trim(),card:paymentCardName(raw.card||''),day:Number(raw.day),amount:Number(raw.amount||0),active:raw.active!==false};
  if(!/^[a-zA-Z0-9_-]{1,80}$/.test(r.id)||ids.has(r.id))throw new Error('납부 항목 ID를 확인해 주세요.');ids.add(r.id);
  if(!['rent','card','other'].includes(r.type)||!Number.isInteger(r.day)||r.day<1||r.day>31||!Number.isSafeInteger(r.amount)||r.amount<0||r.amount>999999999)throw new Error('납부일과 예상 금액을 확인해 주세요.');
  if(r.type==='rent')r.name='임대료';
  if(r.type==='card'){if(!r.card||r.card.length>60)throw new Error('카드사를 선택해 주세요.');r.name=r.card;}
  if(!r.name||r.name.length>60)throw new Error('납부 항목 이름을 입력해 주세요.');
  const key=r.type+':'+(r.type==='card'?r.card:r.type==='other'?r.name:'임대료');
  if(matches.has(key))throw new Error('같은 납부 항목이나 카드사가 중복돼 있습니다.');matches.add(key);
  return r;
 });
 const closedDays=[...new Set(config.closedDays||[])];
 if(closedDays.length>200||closedDays.some(d=>!paymentValidDate(d)))throw new Error('임시휴일은 YYYY-MM-DD 형식으로 입력해 주세요.');
 return{version:1,rules,closedDays:closedDays.sort()};
}
function paymentInferredRules(expenses){
 const rent=expenses.filter(e=>e.category==='임대료'&&e.amount>0).sort((a,b)=>b.date.localeCompare(a.date))[0];
 return rent?[{id:'rent-default',type:'rent',name:'임대료',card:'',day:1,amount:Number(rent.amount),active:true}]:[];
}
function paymentTag(ruleId,ym){return '[미미네납부:'+ruleId+':'+ym+']';}
function paymentExtractTag(note){return String(note||'').match(/\[미미네납부:([a-zA-Z0-9_-]+):(\d{4}-\d{2})\]/)?.[0]||'';}
function paymentCleanNote(note){return String(note||'').replace(/\[미미네납부:[a-zA-Z0-9_-]+:\d{4}-\d{2}\]/g,'').trim();}
function paymentComposeNote(note,link){const clean=paymentCleanNote(note),tag=paymentExtractTag(link);return clean+(tag?(clean?'\n':'')+tag:'');}
function paymentRuleMatches(rule,expense){
 if(rule.type==='rent')return expense.category==='임대료';
 if(rule.type==='card')return ['카드 대금','카드대금'].includes(expense.category)&&paymentCardName(expense.vendor)===rule.card;
 return !['임대료','카드 대금','카드대금'].includes(expense.category)&&String(expense.vendor||'').trim()===rule.name;
}
function paymentInstances(config,expenses,today){
 const normalized=paymentValidateConfig(config),ym=today.slice(0,7),months=[paymentMonthShift(ym,-1),ym,paymentMonthShift(ym,1)];
 const all=normalized.rules.filter(r=>r.active).flatMap(rule=>months.map(month=>{
  const nominal=month+'-'+String(Math.min(rule.day,Number(paymentMonthEnd(month).slice(8)))).padStart(2,'0'),business=paymentNextBusinessDay(nominal,normalized.closedDays);
  return{key:rule.id+'|'+month,rule,month,nominal,due:business.date,adjusted:business.adjusted,calendarVerified:business.verified,records:[],paidAmount:0};
 }));
 for(const rule of normalized.rules.filter(r=>r.active)){
  const instances=all.filter(i=>i.rule.id===rule.id);
  for(const e of expenses.filter(e=>e.date<=today&&Number(e.amount)>0&&paymentRuleMatches(rule,e))){
   const tag=String(e.paymentLink||e.note||'').match(/\[미미네납부:([a-zA-Z0-9_-]+):(\d{4}-\d{2})\]/);
   let target;
   if(tag){target=instances.find(i=>i.rule.id===tag[1]&&i.month===tag[2]);}
   else{
    // A month-end bill shifted into the next month belongs to the original
    // cycle. Every untagged expense is assigned to exactly one cycle.
    target=instances.find(i=>i.due.slice(0,7)>i.month&&e.date.slice(0,7)===i.due.slice(0,7)&&e.date<=i.due&&e.date>=i.month+'-01')
      ||instances.find(i=>i.month===e.date.slice(0,7));
   }
   if(target){target.records.push(e);target.paidAmount+=Number(e.amount);}
  }
 }
 return all.map(i=>({...i,status:i.paidAmount>0&&(!i.rule.amount||i.paidAmount>=i.rule.amount)?'paid':i.paidAmount>0?'partial':i.due<today?'overdue':'pending',remaining:Math.max(0,i.rule.amount-i.paidAmount)}));
}
function paymentVisibleInstances(config,expenses,today){
 const ym=today.slice(0,7),all=paymentInstances(config,expenses,today);
 const current=all.filter(i=>i.month===ym||(i.month<ym&&i.due>=ym+'-01'));
 if(!current.some(i=>i.status!=='paid'))current.push(...all.filter(i=>i.month>ym).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,2));
 return current;
}

function createMimineProductionBridge(db,{bankRequest}={}){
 const launch=new URLSearchParams(location.hash.slice(1)).get('allbase')||'';
 const kst=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
 const check=async()=>{const{data,error}=await db.auth.getSession();if(error)throw error;if(!data?.session)throw new Error('로그인이 필요합니다.');return data.session;};
 async function rows(table,order='id',columns='*'){
  const all=[];
  for(let offset=0;offset<100000;offset+=1000){
   let query=db.from(table).select(columns).order(order,{ascending:false});if(order!=='id')query=query.order('id',{ascending:false});const{data,error}=await query.range(offset,offset+999).abortSignal(AbortSignal.timeout(25000));
   if(error)throw new Error(table+' 조회: '+error.message);all.push(...data);
   if(data.length<1000)return all;

 }

   stock?rows('mimine_stock_documents','created_at','id,document_type,purchase_date,supplier,total,item_subtotal,items,fingerprint,expense_id,created_at').then(data=>({data})).catch(error=>({data:[],error:error.message})):{data:[]},
   bankScope?bankApi({action:'list',start,end:today},session).then(data=>({data})).catch(error=>({data:{},error:error.message})):{data:{}},

  const timeFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});

   version:1,analyticsHistory:2,supplyHistory:1,goal:Number(prefs.goal||0),settings:{largeType:!!prefs.largeType,autoMatch:true},
   paymentRulesConfigured:!!paymentSettings.data,paymentRules:paymentSettings.data?.setting_value?.rules||[],paymentClosedDays:paymentSettings.data?.setting_value?.closedDays||[],
   sales:(finance?sr.map(s=>({id:'s-'+s.sale_date,remoteId:String(s.id),date:s.sale_date,amount:Number(s.amount),note:s.memo||'',source:s.payment_method_name||'매출 장부'})):base?.sales||[]).map(s=>{

    return withSettlement(s,settlements.get(s.date));
   }),
   expenses:er.map(e=>({id:String(e.id),date:e.expense_date,amount:Number(e.amount),category:e.category,vendor:e.vendor||e.memo||e.category,note:paymentCleanNote(e.vendor?e.memo||'':''),paymentLink:paymentExtractTag(e.memo)})),
   products:pr.filter(p=>p.is_active!==false).map(p=>{const batches=(batchIndex.get(String(p.id))||[]).sort((a,b)=>b.purchase_date.localeCompare(a.purchase_date)||Number(b.id)-Number(a.id));return{id:String(p.id),name:p.name,imageUrl:productImages.get(String(p.id))||'',category:categories.get(String(p.category_id))||p.category,barcode:p.sku||'',price:Number(p.sale_price),lastSalePrice:Number(p.sale_price),cost:Number(p.purchase_price),min:Number(p.low_stock_threshold??5),supplier:supplierIndex.get(String(p.id))||batches[0]?.supplier||'',color:'#a75542',bg:'#f6e9e3',priceHistory:[],batches:batches.map(b=>({id:String(b.id),qty:Number(b.remaining_quantity),originalQty:Number(b.quantity),cost:Number(b.unit_cost),salePrice:Number(b.sale_price??p.sale_price),date:b.purchase_date,expiry:b.expiration_date||'',source:b.memo||'입고'}))};}),

 }
 function withSettlement(s,t){const card=Number(t?.card_amount||0),cash=Number(t?.cash_amount||0),other=Number(t?.other_amount||0);return {...s,card,cash,other,fee:Number(t?.fee_amount||0),due:t?.due_date||'',settlementKnown:!!t,settlementConsistent:!t||card+cash+other===s.amount};}

function installSaleAmountReplacement(input,requestFrame=fn=>window.requestAnimationFrame?.(fn)){
 let revision=0;
 const selectExisting=()=>{
  const value=input.value,version=revision;
  input.select();
  // A tap may move the caret after focus. Restore selection after that default
  // action, without selecting again once the user has started typing.
  requestFrame(()=>{
   if(input.isConnected&&input.ownerDocument.activeElement===input&&revision===version&&input.value===value)input.select();
  });
 };
 input.addEventListener('input',()=>revision++);
 input.addEventListener('focus',selectExisting);
 input.addEventListener('click',selectExisting);
}

 sheet(type==='sale'?(entryDate===TODAY?'오늘 매출':'일매출')+(initial?' 수정':' 입력'):existing?'지출 수정':'지출 입력',body,`${existing?`<button type="button" class="danger-btn" style="flex:0 0 49px;padding:10px" data-action="delete-record" data-id="${r.id}" data-type="${type}" aria-label="기록 삭제">${icon('trash')}</button>`:''}`,{form:'entry-form',name:'entry',caption:'QUICK ENTRY'});

function syncSalePaymentCalculation(form){

function saveEntry(form){const fd=new FormData(form),type=modalContext.entryType,date=String(fd.get('date')),amount=num(fd.get('entry-amount'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>TODAY)return showError('체험 기준일인 2026년 11월 3일까지 입력해 주세요.');if(type==='expense'&&amount<=0)return showError('지출 금액은 1원 이상 입력해 주세요.');if(amount>999999999)return showError('금액은 10억 원 미만으로 입력해 주세요.');if(type==='sale'){const old=saleOn(date);let card,cash,other,fee,due;if(modalContext.split){card=num(fd.get('card'));cash=num(fd.get('cash'));other=num(fd.get('other'));fee=num(fd.get('fee'));due=String(fd.get('due')||'');if(card+cash+other!==amount)return showError('카드·현금·기타의 합계를 하루 총매출과 맞춰 주세요.');if(fee>card)return showError('수수료는 카드 매출보다 클 수 없어요.');}else{cash=old?.cash||0;other=old?.other||0;if(amount<cash+other)return showError('현금·기타 합계보다 총매출이 적어요. 결제수단을 열어 금액을 확인해 주세요.');card=amount-cash-other;fee=old?.fee||0;due=old?.due||addDays(date,2);}if(fee>card)return showError('수수료가 카드 매출보다 큽니다. 정산정보를 확인해 주세요.');if(old&&linked(old)>Math.max(0,card-fee))return showError('연결된 입금보다 입금 예정액이 작습니다. 입금 화면에서 연결을 먼저 해제해 주세요.');const id=old?.id||uid('s'),record={id,date,amount,card,cash,other,fee,due,note:String(fd.get('note')||''),source:'수동 입력'};if(old)db.sales[db.sales.findIndex(s=>s.id===id)]=record;else db.sales.push(record);}else{const record={id:modalContext.id||uid('e'),date,amount,category:String(fd.get('category')||'기타'),vendor:String(fd.get('vendor')||'').trim(),note:String(fd.get('note')||'')};if(!record.vendor)return showError('사용처나 지출 내용을 입력해 주세요.');const i=db.expenses.findIndex(e=>e.id===record.id);if(i>=0)db.expenses[i]=record;else db.expenses.push(record);}view.date=date;closeModal();notifyMutation(type==='sale'?'매출을 저장했어요. 합계에 반영했습니다.':'지출을 저장했어요. 합계에 반영했습니다.');}

function openSettings(bank=false){sheet(bank?'입금 연결 설정':'설정·연결',`${bank?`<div class="soft-notice">${icon('info')}<span>체험용 입금으로 분류·정산 연결 흐름을 확인합니다.</span></div>`:''}<div class="settings-row"><div><strong>큰 글씨</strong><small>글자를 조금 더 크게 표시합니다.</small></div><button class="switch" role="switch" aria-label="큰 글씨" aria-checked="${!!db.settings.largeType}" data-action="toggle-large"></button></div><div class="settings-row"><div><strong>자동 연결 체험</strong><small>입금자·금액·예정일이 모두 같을 때 연결합니다.</small></div><button class="switch" role="switch" aria-label="자동 연결 체험" aria-checked="${!!db.settings.autoMatch}" data-action="toggle-auto"></button></div><div class="settings-row"><div><strong>현재 연결</strong><small>우리은행·키움페이 예시 데이터</small></div><span class="pill amber">체험 모드</span></div><div class="setting-buttons"><button class="secondary" data-action="sample-bank">${icon('plus')}예시 입금 추가</button><button class="secondary" data-action="export">${icon('download')}장부 CSV 내려받기</button><button class="danger-btn" data-action="reset-confirm">${icon('refresh')}체험 데이터 초기화</button></div><div class="settings-note">이 목업에서는 매출·지출, 입금 분류·연결, 상품 등록·입고·재고 조정이 동작합니다.<br><br>입력한 내용은 ${storageAvailable?'현재 기기·브라우저에 저장됩니다. 다른 기기와 동기화되지 않습니다.':'현재 창에서만 유지됩니다.'}<br>체험 기준일: 2026년 11월 3일</div>`, '<button class="secondary" data-action="close-modal">닫기</button>',{name:'settings',caption:'PREFERENCES'});}
function openMatch(id){const s=db.sales.find(s=>s.id===id);if(!s)return;const links=db.links.filter(l=>l.saleId===id);const candidates=db.events.filter(e=>e.business==='mimine'&&available(e)>0).sort((a,b)=>Math.abs(available(a)-remaining(s))-Math.abs(available(b)-remaining(s)));modalContext={saleId:id};sheet(`${md(s.date)} 매출 · 입금 연결`,`<div class="summary-strip"><span>카드매출 − 수수료</span><strong>${won(expected(s))}</strong></div><div class="info-line"><span>연결된 입금</span><strong>${won(linked(s))}</strong></div><div class="info-line"><span>남은 금액</span><strong class="${remaining(s)?'negative':'positive'}">${won(remaining(s))}</strong></div>${links.length?`<h3 class="spacer" style="margin-bottom:10px">현재 연결</h3>${links.map(l=>{const e=db.events.find(e=>e.id===l.eventId);return`<div class="match-option"><div class="row"><strong>${esc(e?.payer||'입금')}</strong><strong>${won(l.amount)}</strong></div><p>${e?md(e.date):''} · ${l.method} 연결</p><button class="text-button accent" data-action="unlink" data-id="${l.id}">연결 해제</button></div>`;}).join('')}`:''}${remaining(s)?`<h3 class="spacer" style="margin-bottom:10px">연결할 입금 선택</h3>${candidates.map((e,i)=>`<label class="match-option"><div class="row"><span class="check-row" style="margin:0"><input type="radio" name="match-event" value="${e.id}" ${i===0?'checked':''}><strong>${esc(e.payer)}</strong></span><strong>${won(available(e))}</strong></div><p>${md(e.date)} ${e.time} · ${available(e)===remaining(s)?'금액 일치':'연결 가능 금액'}</p></label>`).join('')||'<p class="field-note">연결할 미미네 입금이 없어요. 통장내역에서 사업 구분을 확인해 주세요.</p>'}<div class="form-field spacer"><label for="match-amount">연결할 금액</label>${inputAmount('match-amount',Math.min(remaining(s),candidates[0]?available(candidates[0]):0))}<p class="field-note">일부 금액만 연결하면 나머지는 미완료로 남습니다.</p></div>`:''}`,`${remaining(s)?'<button class="primary" type="submit">선택한 입금 연결</button>':'<button class="secondary" type="button" data-action="close-modal">확인</button>'}`,{form:'match-form',name:'match',caption:'MATCH DEPOSIT'});modalContext={saleId:id};}
function saveMatch(form){const s=db.sales.find(s=>s.id===modalContext.saleId),fd=new FormData(form),e=db.events.find(e=>e.id===fd.get('match-event')),amount=num(fd.get('match-amount'));if(!e)return showError('연결할 입금을 선택해 주세요.');if(e.excluded)return showError('대상 제외한 입금입니다. 제외를 해제한 뒤 연결해 주세요.');if(!amount)return showError('연결할 금액을 입력해 주세요.');if(amount>remaining(s))return showError('매출의 남은 입금 예정액보다 크게 연결할 수 없어요.');if(amount>available(e))return showError('해당 입금의 연결 가능 금액을 넘을 수 없어요.');db.links.push({id:uid('link'),saleId:s.id,eventId:e.id,amount,method:'수동'});closeModal();notifyMutation('입금을 연결했어요. 매출 합계는 그대로 유지됩니다.');}
function autoMatch(){if(!db.settings.autoMatch)return toast('설정에서 자동 연결 체험을 먼저 켜 주세요.');const candidates=[];for(const s of db.sales){if(!remaining(s)||!s.due)continue;const matches=db.events.filter(e=>!e.excluded&&e.business==='mimine'&&isRegisteredMiminePayer(e)&&e.date===s.due&&available(e)===remaining(s));if(matches.length===1)candidates.push({s,e:matches[0]});}const unique=candidates.filter(c=>candidates.filter(x=>x.e.id===c.e.id).length===1);for(const {s,e} of unique)db.links.push({id:uid('link'),saleId:s.id,eventId:e.id,amount:remaining(s),method:'자동'});notifyMutation(unique.length?`${unique.length}건을 자동 연결했어요. 금액이 다른 입금은 직접 확인해 주세요.`:'일치하는 입금이 없어요. 금액·입금자·예정일을 확인해 주세요.');}

function openSampleBank(){const s=db.sales.find(s=>s.date==='2026-11-01');const amt=s?remaining(s):138658;sheet('예시 입금 추가',`${field('입금자',`<input name="payer" value="키움페이" maxlength="50" required>`)}${field('입금일',`<input name="date" type="date" value="${TODAY}" max="${TODAY}" required>`)}${field('입금액',inputAmount('bank-amount',amt||138658))}${field('사업 구분','<select name="business"><option value="mimine">미미네</option><option value="adw">하루온종일</option><option value="unclassified">미분류</option></select>')}<p class="field-note">새 예시 내역을 추가합니다. 실제 은행에서 조회하거나 송금하지 않습니다.</p>`,'<button class="primary" type="submit">예시 내역 추가</button>',{form:'sample-bank-form',name:'sample-bank'});}

function openInbound(id){const p=db.products.find(p=>p.id===id);sheet(`${esc(p.name)} 입고`,`${field('입고일',`<input name="date" type="date" value="${TODAY}" max="${TODAY}" required>`)}<div class="form-grid">${field('입고 수량 (개)','<input name="qty" type="number" value="20" min="1" max="100000" required>')}${field('매입 단가 (원)',`<input name="cost" data-money value="${fmt(p.cost)}" inputmode="numeric" required>`)}</div>${field('유통기한 · 선택','<input name="expiry" type="date">')}<div class="summary-strip"><span>입고 금액</span><strong id="inbound-total">${won(p.cost*20)}</strong></div><label class="check-row"><input name="addExpense" type="checkbox">이 입고 금액을 지출에도 함께 등록</label><p class="field-note">이미 지출을 입력했다면 체크하지 마세요. 입고 재고만 추가합니다.</p>`,'<button class="primary" type="submit">입고 저장</button>',{form:'inbound-form',name:'inbound'});modalContext={productId:id};}
function openAdjust(id){const p=db.products.find(p=>p.id===id);sheet('실제 재고 수량 조정',`<p class="subtext" style="margin:0 0 18px">${esc(p.name)} · 기록 재고 ${stock(p)}개</p>${field('실제 남은 수량 (개)',`<input name="qty" type="number" min="0" max="100000" value="${stock(p)}" required>`)}${field('조정 사유','<select name="reason"><option>실제 수량 확인</option><option>판매 수량 반영</option><option>폐기·파손</option></select>')}<p class="field-note">수량을 줄이면 유통기한이 빠른 입고분부터 차감합니다. 늘어난 수량은 유통기한 미등록 입고분으로 추가됩니다.</p>`,'<button class="primary" type="submit">재고 수량 적용</button>',{form:'adjust-form',name:'adjust'});modalContext={productId:id};}
function exportCSV(){const bounds=['today','reports'].includes(view.page)?[flow.start,flow.end]:rangeBounds();const records=allRecords(bounds);const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return'"'+s.replaceAll('"','""')+'"';};const lines=[['날짜','구분','항목','내용','금액(원)','카드(원)','현금(원)','메모'],...records.map(r=>[r.date,r.type==='sale'?'매출':'지출',r.category||'일매출',r.vendor||'일매출 마감',r.amount,r.card??'',r.cash??'',r.note||''])];const blob=new Blob(['\ufeff'+lines.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`미미네_장부_${bounds[0]}_${bounds[1]}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('선택 기간의 장부 CSV를 내려받았어요.');}
function submitForm(form){const fd=new FormData(form);switch(form.id){case'entry-form':saveEntry(form);break;case'date-form':view.date=$('#chosen-date').value;closeModal();render();break;case'range-form':{const a=String(fd.get('start')),b=String(fd.get('end'));if(a>b)return showError('시작일은 종료일보다 앞서야 합니다.');view.customStart=a;view.customEnd=b;view.range='custom';closeModal();render();break;}case'goal-form':db.goal=num(fd.get('goal-amount'));if(db.goal<=0)return showError('목표 금액을 1원 이상 입력해 주세요.');closeModal();notifyMutation('이번 달 목표를 저장했어요.');break;case'match-form':saveMatch(form);break;case'classify-form':{const e=db.events.find(e=>e.id===modalContext.eventId),business=String(fd.get('business'));if(business!=='mimine'&&db.links.some(l=>l.eventId===e.id))return showError('정산 연결을 먼저 해제해 주세요.');e.business=business;closeModal();notifyMutation('입금 사업 구분을 저장했어요.');break;}case'sample-bank-form':{const amount=num(fd.get('bank-amount'));if(amount<=0)return showError('입금액을 입력해 주세요.');db.events.push({id:uid('bank'),date:String(fd.get('date')),time:'12:00',payer:String(fd.get('payer')).trim(),amount,business:String(fd.get('business')),note:'사용자가 추가한 예시 입금'});closeModal();notifyMutation('예시 입금을 추가했어요. 입금 화면에서 연결할 수 있습니다.');break;}case'product-form':{const name=String(fd.get('name')||'').trim();if(!name)return showError('상품명을 입력해 주세요.');const duplicate=db.products.some(p=>p.name===name&&p.id!==modalContext.productId);if(duplicate)return showError('같은 이름의 상품이 있어요. 기존 상품을 확인해 주세요.');const p=db.products.find(p=>p.id===modalContext.productId);const values={name,category:String(fd.get('category')),price:num(fd.get('price')),cost:num(fd.get('cost')),min:num(fd.get('min'))};if(p)Object.assign(p,values);else db.products.push({...values,id:uid('p'),color:'#6d8564',bg:'#eaf0e3',batches:num(fd.get('qty'))?[{id:uid('b'),qty:num(fd.get('qty')),expiry:String(fd.get('expiry')||''),date:TODAY}]:[]});closeModal();notifyMutation('상품 정보를 저장했어요.');break;}case'inbound-form':{const p=db.products.find(p=>p.id===modalContext.productId),qty=num(fd.get('qty')),cost=num(fd.get('cost')),date=String(fd.get('date'));if(qty<1)return showError('입고 수량을 1개 이상 입력해 주세요.');p.batches.push({id:uid('b'),qty,cost,expiry:String(fd.get('expiry')||''),date});if(fd.get('addExpense')==='on')db.expenses.push({id:uid('e'),date,amount:qty*cost,category:'상품매입',vendor:p.name+' 입고 '+qty+'개',note:'입고와 함께 등록'});closeModal();notifyMutation(`${p.name} ${qty}개를 입고했어요.${fd.get('addExpense')==='on'?' 지출에도 반영했습니다.':''}`);break;}case'adjust-form':{const p=db.products.find(p=>p.id===modalContext.productId),target=num(fd.get('qty')),current=stock(p);if(target<current){let diff=current-target;for(const b of [...p.batches].sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'))){const n=Math.min(diff,b.qty);b.qty-=n;diff-=n;if(!diff)break;}}else if(target>current)p.batches.push({id:uid('b'),qty:target-current,date:TODAY,expiry:''});p.lastAdjustment={date:TODAY,reason:String(fd.get('reason')),from:current,to:target};closeModal();notifyMutation('실제 수량으로 재고를 조정했어요.');break;}}}

function chartPath(rows,key,x,y){

function comparePanel(){const pb=elapsedPriorBounds();if(!pb)return`<section class="flow-compare-card"><div class="flow-card-title"><h2>기간별 비교</h2><button class="text-button" data-action="flow-compare">비교 기간 선택${icon('right')}</button></div><p class="flow-note">작년 같은 기간, 직전 기간 또는 직접 고른 기간과 비교할 수 있어요.</p></section>`;const a=periodStats(flow.start,flow.end),b=periodStats(...pb);if(!a.days)return`<section class="flow-compare-card"><div class="flow-card-title"><h2>기간별 비교</h2></div><p class="flow-note">아직 집계할 실제 매출이 없는 기간입니다. 그래프에서 작년 매출을 참고하세요.</p></section>`;return`<section class="flow-compare-card"><div class="flow-card-title"><h2>${flow.compare==='year'?'작년과 얼마나 달라졌나요?':'기간별 비교'}</h2><button class="text-button" data-action="flow-compare" aria-label="비교 조건 변경">조건 변경${icon('right')}</button></div><div class="comparison-ranges"><span><i></i>조회 ${shortRange(flow.start,flow.end>TODAY?TODAY:flow.end)} <b>${a.days}일</b></span><span><i></i>비교 ${shortRange(...pb)} <b>${b.days}일</b></span></div><div class="compare-table-wrap"><table class="flow-comparison-table"><thead><tr><th>항목</th><th>조회 기간</th><th>비교 기간</th><th>차이</th></tr></thead><tbody>${Object.entries(METRIC).map(([key,m])=>`<tr><th class="metric-${key}">${m.name}</th><td class="metric-${key}">${key==='sales'?todaySalesAmount(fmt(a[key]),'조회 기간 매출'):key==='cost'?todayExpenseAmount(fmt(a[key]),'조회 기간 지출'):fmt(a[key])}</td><td class="metric-previous">${fmt(b[key])}</td><td class="metric-balance ${changeTone(a[key]-b[key])}"><strong>${signed(a[key]-b[key])}</strong><small>${percent(a[key],b[key])} ${a[key]===b[key]?'동일':a[key]>b[key]?'증가':'감소'}</small></td></tr>`).join('')}<tr class="daily-average-row"><th>입력일 평균 매출</th><td class="metric-sales">${todaySalesAmount(a.avg===null?'—':fmt(a.avg),'평균 매출')}</td><td class="metric-previous">${b.avg===null?'—':fmt(b.avg)}</td><td class="metric-balance ${changeTone(a.avg===null||b.avg===null?null:a.avg-b.avg)}">${a.avg===null||b.avg===null?'—':signed(a.avg-b.avg)}<small>${a.avg===nul function salesYearComparison(){
 const end=flow.end>TODAY?TODAY:flow.end,hasElapsed=flow.start<=end;
 const bounds=hasElapsed?[flow.start,end]:[flow.start,flow.end];
 const prior=[shiftedYear(bounds[0]),shiftedYear(bounds[1])];
 const current=hasElapsed?periodStats(...bounds):null,previous=periodStats(...prior);
 return{bounds,prior,current,previous,sales:current?.recorded?current.sales:null,

}
function cumulativeSalesRows(){

  const s=date>TODAY?null:saleOn(date),p=saleOn(shiftedYear(date));

  return{date,current:s?current:null,previous:p?previous:null,future:date>TODAY};
 });
}

function ruleCandidates(data,event){return(data.payerRules||[]).filter(r=>r.active&&payerKey(r.payer)===payerKey(event.payer));}
function applyPayerRules(data){let registered=0;for(const e of data.events){if(e.excluded||e.classificationSource==='manual')continue;const candidates=ruleCandidates(data,e);if(candidates.length!==1){if(candidates.length>1)e.autoReason='입금자명 중복 확인';continue;}const r=candidates[0];if(e.business!=='unclassified'&&e.business!==r.business&&!e.autoRegistered)continue;if(e.business!==r.business||e.autoRuleId!==r.id)registered++;e.business=r.business;e.autoRegistered=true;e.autoRuleId=r.id;e.autoReason='입금자명 일치';}return registered;}

function autoConnectByRules(data){if(!data.settings.autoMatch)return 0;const links=data.links,got=s=>sum(links.filter(l=>l.saleId===s.id)),remainingFor=s=>Math.max(0,s.card-s.fee-got(s)),free=e=>Math.max(0,e.amount-sum(links.filter(l=>l.eventId===e.id)));const candidates=[];for(const e of data.events){if(e.excluded||e.business!=='mimine'||!free(e))continue;const rules=ruleCandidates(data,e);if(rules.length!==1||rules[0].business!=='mimine')continue;const sales=data.sales.filter(s=>s.due===e.date&&remainingFor(s)>0&&remainingFor(s)===free(e));if(sales.length===1)candidates.push({e,s:sales[0]});}let count=0;for(const c of candidates){if(candidates.filter(x=>x.s.id===c.s.id).length!==1)continue;const amount=free(c.e);if(!amount||amount!==remainingFor(c.s))continue;links.push({id:uid('link'),saleId:c.s.id,eventId:c.e.id,amount,method:'자동'});count++;}return count;}

function setBankPeriod(preset){bankPeriod.preset=preset;bankPeriod.end=TODAY;if(preset==='today')bankPeriod.start=TODAY;else if(preset==='week')bankPeriod.start=addDays(TODAY,-6);else if(preset==='lastMonth'){bankPeriod.end=addDays(TODAY.slice(0,7)+'-01',-1);bankPeriod.start=bankPeriod.end.slice(0,7)+'-01';}else bankPeriod.start=TODAY.slice(0,7)+'-01';render();}
function bankPeriodHTML(){return`<section class="deposit-period"><div class="deposit-presets">${[['today','오늘'],['week','최근 7일'],['month','이번 달'],['lastMonth','지난달'],['custom','직접']].map(([v,l])=>`<button class="${bankPeriod.preset===v?'active':''}" data-action="deposit-period" data-value="${v}">${l}</button>`).join('')}<button class="payer-rule-shortcut" data-action="payer-rules">${icon('settings')}입금자명</button></div><button class="deposit-date-range" data-action="deposit-range">${icon('calendar')}${shortRange(bankPeriod.start,bankPeriod.end)}${icon('down')}</button></section>`;}
function monthlyDepositsHTML(){const groups={};for(const e of db.events){const ym=e.date.slice(0,7);groups[ym]??={all:0,mimine:0,excluded:0,count:0};groups[ym].all+=e.amount;groups[ym].count++;if(e.excluded)groups[ym].excluded+=e.amount;else if(e.business==='mimine')groups[ym].mimine+=e.amount;}return`<details class="monthly-deposit-card"><summary>월별 입금 합계 <small>월을 눌러 조회</small>${icon('down')}</summary><table><thead><tr><th>월</th><th>전체 입금</th><th>미미네 입금</th></tr></thead><tbody>${Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,g])=>`<tr><th><button data-action="deposit-month" data-value="${ym}" aria-label="${ym} 입금 조회">${ym.replace('-','.')} ${icon('right')}</button></th><td>${fmt(g.all)}</td><td class="metric-sales">${fmt(g.mimine)}</td></tr>`).join('')}</tbody></table><p>단위: 원 · 전체 입금은 대상 제외도 포함한 원본 합계입니다.</p></details>`;}
const bankCardBeforePayers=bankEventCard;
bankEventCard=function(e){return bankCardBeforePayers(e).replace('<div class="bank-entry-actions">','<div class="bank-entry-actions">'+(e.autoRegistered?'<span class="pill auto-deposit-pill">자동 등록</span>':''));};
const bankBeforePayerRules=renderBank;
renderBank=function(){if(view.bankTab!=='transactions')return bankBeforePayerRules();const all=bankBoundsRows(),excluded=all.filter(e=>e.excluded),active=all.filter(e=>!e.excluded),scope=view.bankScope||'active';let events=scope==='excluded'?excluded:scope==='all'?all:active;if(view.bankBusiness!=='all')events=events.filter(e=>e.business===view.bankBusiness);const mimine=active.filter(e=>e.business==='mimine'),auto=active.filter(e=>e.autoRegistered);return heading('BANK TRANSACTIONS','통장 입금','입금자명 자동 등록 · 기간별 입금 확인',`<button class="secondary compact" data-action="payer-rules">${icon('settings')}입금자명</button>`)+`<div class="page-toolbar"><div class="segmented"><button class="active" data-action="bank-tab" data-value="transactions">통장내역</button><button data-action="bank-tab" data-value="compare">카드정산 확인</button></div><button class="text-button" data-action="sms-demo">${icon('refresh')}새로고침</button></div>${bankPeriodHTML()}<section class="deposit-total-grid"><div><small>조회 기간 총입금</small><strong class="metric-sales">${moneyMarkup(sum(all))}</strong><span>${all.length}건 · 제외 포함 원본</span></div><div><small>미미네 입금</small><strong class="metric-sales">${moneyMarkup(sum(mimine))}</strong><span>${mimine.length}건 · 제외 미포함</span></div><div><small>현재 목록 합계</small><strong class="metric-sales">${moneyMarkup(sum(events))}</strong><span>${events.length}건 · 아래 필터 반영</span></div><div><small>대상 제외 합계</small><strong>${moneyMarkup(sum(excluded))}</strong><span>${excluded.length}건</span></div></section>${monthlyDepositsHTML()}<div class="payer-status-bar"><span>${auto.length}건 입금자명 자동 등록</span><button data-action="payer-rules">규칙 관리${icon('right')}</button></div><div class="bank-scope-tabs" aria-label="입금 대상 구분">${[['active','확인 대상',active.length],['excluded','대상 제외',excluded.length],['all','전체',all.length]].map(([id,label,n])=>`<button class="${scope===id?'active':''}" data-action="bank-scope" data-value="${id}" aria-pressed="${scope===id}">${label}<span>${n}</span></button>`).join('')}</div><div class="bank-business-toolbar"><div class="product-filters">${[['all','전체 사업'],['mimine','미미네'],['adw','하루온종일'],['unclassified','미분류']].map(([id,label])=>`<button class="chip ${view.bankBusiness===id?'active':''}" data-action="business-filter" data-value="${id}">${label}</button>`).join('')}</div></div><section class="list-card bank-transactions-list">${events.map(bankEventCard).join('')||emptyHTML(scope==='excluded'?'대상 제외한 입금이 없어요':'조건에 맞는 입금이 없어요','기간이나 사업 구분을 바꿔 보세요.')}</section><p class="bank-exclusion-note">이 목업은 수신 체험 데이터로 동작합니다. 실제 자동 수신은 하루온종일의 문자 수신 서버 연결이 필요합니다. 통장 입금은 매출에 중복 합산하지 않습니다.</p>`;};
function openDepositRange(){sheet('입금 조회 기간',`<div class="form-grid">${field('조회 시작일',`<input name="start" type="date" value="${bankPeriod.start}" max="${TODAY}" required>`)}${field('조회 종료일',`<input name="end" type="date" value="${bankPeriod.end}" max="${TODAY}" required>`)}</div>`,'<button class="primary" type="submit">기간 적용</button>',{name:'deposit-range',form:'deposit-range-form'});}
function openPayerRules(){sheet('입금자명 자동 등록',`<p class="supply-intro">문자에 표시된 입금자명을 사업에 연결합니다. 한 사업에 여러 이름을 등록할 수 있어요.</p><div class="payer-rule-form">${field('연결할 사업','<select name="business"><option value="mimine">미미네</option><option value="adw">하루온종일</option><option value="other">기타</option></select>')}${field('문자에 표시된 입금자명','<input name="payer" placeholder="예: 키움페이, 카드정산 입금자명" maxlength="100" required>')}${field('구분 메모 · 선택','<input name="label" placeholder="예: 키움페이 카드 정산" maxlength="80">')}<button type="submit" class="primary full">입금자명 등록</button></div><h3 class="payer-list-heading">등록한 입금자명</h3><div class="payer-rule-list">${db.payerRules.map(r=>`<div class="payer-rule-row"><div><strong>${esc(r.payer)}</strong><small>${businessName(r.business)}${r.label?' · '+esc(r.label):''}</small></div><button type="button" class="rule-toggle ${r.active?'':'paused'}" data-action="toggle-payer-rule" data-id="${r.id}">${r.active?'사용 중지':'다시 사용'}</button></div>`).join('')}</div><p class="field-note spacer">사용 중지는 새 입금에 대한 자동 등록만 멈춥니다. 기존 입금내역은 남습니다. 이름·금액·정산일이 유일하게 일치하면 정산도 자동 연결합니다.</p><button type="button" class="secondary full spacer" data-action="sms-demo">${icon('refresh')}새로고침</button>`,'<button type="button" class="secondary" data-action="close-modal">닫기</button>',{name:'payer-rules',form:'payer-rule-form',caption:'PAYER RULES'});}
function smsSample(){const r=db.payerRules.find(r=>r.active&&r.business==='mimine');return`[Web발신]\n우리 11/03 12:30\n*123456\n입금 125,000원\n${r?.payer||'키움페이'}\n잔액 1,250,000원`;}
function parseDepositSms(message){const text=String(message||'').normalize('NFKC').replace(/\r/g,''),lines=text.split('\n').map(s=>s.trim()).filter(Boolean);if(lines.some(s=>/^출금\s/.test(s)))throw new Error('출금 문자는 입금으로 등록할 수 없어요.');const head=lines.find(s=>/^우리\s+\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}$/.test(s)),account=lines.find(s=>/^\*\d{6}$/.test(s));const credit=lines.map((s,i)=>/^입금\s+(?:\d{1,3}(?:,\d{3})+|\d+)원$/.test(s)?i:-1).filter(i=>i>=0);if(!head||!account||credit.length!==1)throw new Error('우리은행 입금 문자 형식을 확인해 주세요. 날짜·계좌 끝자리·입금액이 필요합니다.');const i=credit[0],amount=num(lines[i]),payer=lines[i+1];if(!payer||/^잔액|^입금|^출금/.test(payer)||amount<=0||amount>1000000000)throw new Error('입금자명과 금액을 확인해 주세요.');const[month,dd,hour,minute]=head.match(/\d+/g).map(Number),date=TODAY.slice(0,4)+'-'+String(month).padStart(2,'0')+'-'+String(dd).padStart(2,'0'),time=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');if(date>TODAY||day(date).toISOString().slice(0,10)!==date||hour>23||minute>59)throw new Error('문자의 날짜·시간을 확인해 주세요.');const accountSuffix=account.slice(1),dedupeKey=JSON.stringify([accountSuffix,date,time,amount,payerKey(payer)]);return{date,time,amount,payer,accountSuffix,dedupeKey,business:'unclassified',source:'문자 수신 체험'};}
function openSmsDemo(){sheet('입금 문자 수신 체험',`${field('입금 문자 내용',`<textarea name="message" rows="7" maxlength="2000" required>${esc(smsSample())}</textarea>`)}<div class="soft-notice neutral">${icon('info')}<span>이 체험은 이미 받은 문자 내용을 등록합니다. 은행 조회나 휴대폰 문자 권한을 연결하지 않습니다.</span></div><p class="field-note spacer">등록한 입금자명과 정확히 일치하면 자동으로 사업을 구분합니다. 같은 문자를 다시 넣어도 중복 저장하지 않습니다.</p>`,'<button class="primary" type="submit">문자 수신 체험</button>',{name:'sms-demo',form:'sms-demo-form'});}
const actionBeforePayerRules=action;
action=function(el){const{action:a,value,id}=el.dataset;switch(a){case'bank-settings':case'payer-rules':openPayerRules();return;case'deposit-period':if(value==='custom')openDepositRange();else setBankPeriod(value);return;case'deposit-range':openDepositRange();return;case'deposit-month':bankPeriod.start=value+'-01';bankPeriod.end=lastDay(value)>TODAY?TODAY:lastDay(value);bankPeriod.preset='custom';render();return;case'sms-demo':openSmsDemo();return;case'toggle-payer-rule':{const next=structuredClone(db),r=next.payerRules.find(x=>x.id===id);if(!r.active&&next.payerRules.some(x=>x.id!==r.id&&x.active&&payerKey(x.payer)===payerKey(r.payer)))return showError('같은 입금자명을 사용하는 규칙이 있어요. 해당 규칙을 먼저 중지해 주세요.');r.active=!r.active;const assigned=r.active?applyPayerRules(next):0,linked=r.active?autoConnectByRules(next):0;if(saveSupplyData(next,r.active?`자동 등록 사용 · ${assigned}건 적용 / 정산 ${linked}건 연결`:'이 입금자명의 자동 등록을 중지했어요.'))openPayerRules();return;}default:return actionBeforePayerRules(el);}};
const submitBeforePayerRules=submitForm;
submitForm=function(form){const fd=new FormData(form);if(form.id==='deposit-range-form'){const a=String(fd.get('start')),b=String(fd.get('end'));if(a>b)return showError('시작일은 종료일보다 앞서야 합니다.');bankPeriod.start=a;bankPeriod.end=b;bankPeriod.preset='custom';closeModal();render();return;}if(form.id==='payer-rule-form'){const payer=String(fd.get('payer')||'').trim(),business=String(fd.get('business'));if(!payer)return showError('입금자명을 입력해 주세요.');if(db.payerRules.some(r=>r.active&&payerKey(r.payer)===payerKey(payer)))return showError('이미 사용 중인 입금자명입니다. 기존 규칙을 확인해 주세요.');const next=structuredClone(db);next.payerRules.unshift({id:uid('rule'),payer,business,label:String(fd.get('label')||''),active:true});const assigned=applyPayerRules(next),linked=autoConnectByRules(next);if(saveSupplyData(next,`입금자명 등록 · ${assigned}건 자동 등록 / 정산 ${linked}건 연결`))openPayerRules();return;}if(form.id==='sms-demo-form'){let event;try{event=parseDepositSms(fd.get('message'));}catch(e){return showError(e.message);}if(db.events.some(e=>e.dedupeKey===event.dedupeKey||(e.date===event.date&&e.time===event.time&&e.amount===event.amount&&payerKey(e.payer)===payerKey(event.payer)&&(!e.accountSuffix||e.accountSuffix===event.accountSuffix))))return showError('이미 등록된 입금 문자입니다. 중복 저장하지 않았어요.');const next=structuredClone(db);event.id=uid('bank');next.events.push(event);applyPayerRules(next);const connected=autoConnectByRules(next);view.bankTab='transactions';view.bankScope='active';view.bankBusiness='all';bankPeriod.start=event.date.slice(0,7)+'-01';bankPeriod.end=event.date;saveSupplyData(next,event.autoRegistered?`${businessName(event.business)} 입금 ${won(event.amount)} 자동 등록${connected?' · 정산 '+connected+'건 연결':''}`:'입금을 등록했어요. 미분류 내역을 확인해 주세요.');return;}if(form.id==='classify-form'){const event=db.events.find(e=>e.id===modalContext.eventId);if(event&&!(String(fd.get('business'))!=='mimine'&&db.links.some(l=>l.eventId===event.id))){event.classificationSource='manual';delete event.autoRegistered;delete event.autoRuleId;delete event.autoReason;}}return submitBeforePayerRules(form);};

/* Real, browser-local receipt OCR and barcode scanning; review before stock import. */
const supply={scanReader:null,scanControls:null,worker:null,token:0,receipt:null,pendingBarcode:'',lastReceiptImage:'',scanEpoch:0,scanDraft:null};
const assetUrl=path=>new URL('flow/'+path,document.baseURI).href;
const scriptLoads=new Map();
function loadBrowserScript(path){if(scriptLoads.has(path))return scriptLoads.get(path);const p=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=assetUrl(path);s.onload=resolve;s.onerror=()=>{scriptLoads.delete(path);reject(new Error('인식 기능을 불러오지 못했어요. 다시 시도해 주세요.'));};document.head.appendChild(s);});scriptLoads.set(path,p);return p;}
function stopBarcodeCamera(){supply.scanEpoch++;try{supply.scanControls?.stop();}catch{}supply.scanControls=null;const video=$('#barcode-video');if(video?.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}supply.scanReader=null;}
const closeBeforeSupplies=closeModal;
closeModal=function(){supply.token++;stopBarcodeCamera();if(supply.worker){supply.worker.terminate().catch(()=>{});supply.worker=null;}return closeBeforeSupplies();};
function lastSellingPrice(p){return Number(p?.lastSalePrice??p?.price??0);}
function productPriceFields(p={}){return`<div class="form-grid">${field('원가 / 매입 단가 (원)',`<input name="cost" data-money inputmode="numeric" value="${fmt(p.cost||0)}" required>`)}${field('판매가 (원)',`<input name="price" data-money inputmode="numeric" value="${fmt(lastSellingPrice(p))}" required>`)}</div><p class="field-note price-memory-note">${p.id?'이 상품에 직전 등록한 판매가를 기본으로 불러왔어요.':'처음 등록하는 상품의 판매가를 입력해 주세요.'}</p>`;}
const productsBeforeSupplies=renderProducts;
renderProducts=function(){let ps=db.products.filter(p=>view.productFilter==='low'?stock(p)<=p.min:view.productFilter==='expiry'?expiring(p):true).filter(p=>[p.name,p.barcode,p.supplier].join(' ').toLowerCase().includes(view.productQuery.toLowerCase()));return`<div class="product-page supply-products">${heading('PRODUCTS & STOCK','상품·입고','원가·판매가·수량·유통기한 관리',`<button class="secondary compact" data-action="product-new">${icon('plus')}상품 등록</button>`)}<div class="supply-quick-actions"><button data-action="barcode-open">${icon('box')}바코드 조회·등록</button><button data-action="receipt-open">${icon('ledger')}영수증으로 입고</button><button data-action="receipt-history">${icon('clock')}입고 기록</button></div><div class="product-toolbar"><div class="product-filters">${[['all','전체',db.products.length],['low','재고 부족',db.products.filter(p=>stock(p)<=p.min).length],['expiry','유통기한 임박',db.products.filter(expiring).length]].map(([id,l,n])=>`<button class="chip ${view.productFilter===id?'active':''}" data-action="product-filter" data-value="${id}">${l}<span>${n}</span></button>`).join('')}</div><label class="search-box">${icon('search')}<input data-search="products" placeholder="상품명·바코드 검색" aria-label="상품 검색" value="${esc(view.productQuery)}"></label></div><div class="product-grid">${ps.map(p=>{const qty=stock(p),e=expiry(p),margin=lastSellingPrice(p)-(p.cost||0);return`<button class="product-card supply-product-card" data-action="product-detail" data-id="${p.id}">${productVisual(p)}${qty<=p.min?'<span class="pill red">재고 부족</span>':expiring(p)?'<span class="pill amber">기한 임박</span>':''}<h3>${esc(p.name)}</h3><span class="category">${esc(p.category)}</span><div class="product-cost-prices"><span>원가 <b class="metric-cost">${won(p.cost)}</b></span><span>${isStoreSupply(p)?'사용 구분':'판매가'} <b class="metric-sales">${isStoreSupply(p)?'매장용':won(lastSellingPrice(p))}</b></span></div><div class="product-stock"><strong class="${qty<=p.min?'negative':''}">${fmt(qty)}<span>개</span></strong><small class="metri function openReceiptPaste(){sheet('영수증 글자 직접 입력',`${field('영수증 원문','<textarea name="text" rows="9" placeholder="상품명  단가  수량  금액\n신라면 810 20 16200" required></textarea>')}<p class="field-note">한 줄에 상품명·단가·수량·금액 순서로 붙여넣으면 품목을 나눕니다.</p>`,'<button class="primary" type="submit">품목 나누기</button>',{name:'receipt-paste',form:'receipt-paste-form'});}
function receiptItemHTML(item,index){const p=db.products.find(p=>p.id===item.productId);return`<article class="receipt-item" data-receipt-item="${item.id}"><div class="receipt-item-header"><label><input type="checkbox" data-ri="checked" ${item.checked?'checked':''}><strong>${index+1}. ${esc(item.name)}</strong></label><span class="pill ${p?'green':'amber'}">${p?'기존 상품':'새 상품'}</span></div><label class="receipt-match-label">연결할 상품<select data-ri="productId"><option value="">새 상품으로 등록</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===item.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="receipt-new-name ${item.productId?'hidden':''}">${field('새 상품명',`<input data-ri="name" value="${esc(item.name)}" maxlength="80">`)}</div><label class="receipt-category-label">물품 분류<select data-ri="category" ${item.productId?'disabled':''}>${[...new Set([...productionCategories(),item.category||'기타'])].map(c=>`<option ${c===(item.category||'기타')?'selected':''}>${esc(c)}</option>`).join('')}</select></label><div class="receipt-item-grid"><label>원가 / 개<input data-ri="unitCost" data-money inputmode="numeric" value="${fmt(item.unitCost)}"></label><label>수량<input data-ri="qty" type="number" min="1" max="100000" step="1" value="${item.qty}"></label><label>판매가 / 개${isStoreSupply(item)?' · 불필요':''}<input ${isStoreSupply(item)?'disabled':''} data-ri="salePrice" data-money inputmode="numeric" value="${fmt(isStoreSupply(item)?0:item.salePrice)}"></label><label>유통기한 · 선택<input data-ri="expiry" type="date" value="${esc(item.expiry)}"></label></div><div class="receipt-item-subtotal"><small>입고 금액</small><strong class="metric-cost" data-item-total>${won(item.unitCost*item.qty)}</strong></div>${item.warning?`<p class="receipt-warning">${esc(item.warning)}</p>`:''}</article>`;}
function receiptReviewTotal(){const items=supply.receipt.items.filter(i=>i.checked),total=sum(items,i=>i.unitCost*i.qty);return{items,total,qty:sum(items,i=>i.qty)};}
function openReceiptReview(){const r=supply.receipt;if(!r)return;const totals=receiptReviewTotal();sheet('영수증 품목 확인',`<div class="receipt-review-top">${r.imageData?`<img src="${esc(r.imageData)}" alt="영수증 미리보기">`:icon('ledger')}<div><strong>읽힌 ${r.items.length}개 품목을 확인하세요.</strong><p>상호와 읽힌 내용을 확인·수정하세요. 매장용 물품은 판매가가 필요 없어요.</p></div></div><div class="form-grid">${field('입고일',`<input id="receipt-date" type="date" value="${r.date}" max="${TODAY}" required>`)}${field('상호·구매처 · 확인/수정',`<input id="receipt-supplier" maxlength="80" value="${esc(r.supplier)}" placeholder="구매처">`)}</div><p class="receipt-warning">${esc(r.supplierSource||'상호를 읽지 못했어요. 구매처를 직접 입력해 주세요.')} · 인식 결과는 저장 전 확인해 주세요.</p>${r.unparsed?.length?`<details class="receipt-unparsed"><summary>확인이 필요한 원문 ${r.unparsed.length}줄</summary><pre>${esc(r.unparsed.join('\n'))}</pre><p>할인·누락 품목은 원문을 확인하고 아래에서 추가·수정해 주세요.</p></details>`:''}<div id="receipt-items">${r.items.map(receiptItemHTML).join('')||'<div class="empty"><p>품목을 나누지 못했어요. 아래에서 직접 추가해 주세요.</p></div>'}</div><button type="button" class="secondary full" data-action="receipt-add-item">${icon('plus')}품목 추가</button><details class="receipt-raw-text"><summary>인식된 원문 보기</summary><pre>${esc(r.rawText)}</pre></details><div class="receipt-review-summary"><span id="receipt-total-label">${totals.items.length}종 · ${totals.qty}개</span><strong class="metric-cost" id="receipt-review-total">${won(totals.total)}</strong></div><div class="form-field receipt-grand-field"><label for="receipt-grand-total">영수증 합계 · 확인 / 수정</label><input id="receipt-grand-total" data-money inputmode="numeric" value="${fmt(r.total||totals.total)}"></div><p class="receipt-total-check" id="receipt-total-check">${r.total?(totals.total===r.total?'영수증 합계 '+won(r.total)+'과 일치합니다.':'영수증 합계 '+won(r.total)+'와 상품 합계가 다릅니다. 할인·누락을 확인해 주세요.'):'영수증 원문 합계를 읽지 못했어요. 상품 금액을 확인해 주세요.'}</p><label class="check-row receipt-adjustment-approval ${r.total&&r.total!==totals.total?'':'hidden'}" id="receipt-adjustment-row"><input id="receipt-adjustment-ok" type="checkbox">합계 차이를 할인·추가 비용으로 확인했습니다.</label><label class="check-row"><input id="receipt-add-expense" type="checkbox" checked>입고 금액을 비용에도 한 번 등록</label><p class="field-note">이미 비용에 등록했다면 체크를 해제해 주세요. 유통기한은 영수증에 없을 수 있어 직접 입력합니다.</p>`,'<button class="primary" type="submit">확인한 품목 입고</button>',{name:'receipt-review',form:'receipt-review-form',caption:'REVIEW BEFORE SAVING'});}
function updateReceiptTotals(){const r=supply.receipt;if(!r)return;const t=receiptReviewTotal();if($('#receipt-review-total'))$('#receipt-review-total').textContent=won(t.total);if($('#receipt-total-label'))$('#receipt-total-label').textContent=t.items.length+'종 · '+t.qty+'개';if($('#receipt-adjustment-row'))$('#receipt-adjustment-row').classList.toggle('hidden',!r.total||r.total===t.total);if($('#receipt-total-check'))$('#receipt-total-check').textContent=r.total?(r.total===t.total?'영수증 합계 '+won(r.total)+'과 일치합니다.':'영수증 합계 '+won(r.total)+'와 상품 합계가 다릅니다. 할인·누락을 확인해 주세요.'):'영수증 합계를 읽지 못했어요. 상품 금액을 확인해 주세요.';}
function syncReceiptFields(){const r=supply.receipt;if(!r)return;r.date=$('#receipt-date')?.value||r.date;r.supplier=$('#receipt-supplier')?.value||'';r.total=num($('#receipt-grand-total')?.value||r.total);for(const el of $$('#receipt-items [data-receipt-item]')){const item=r.items.find(i=>i.id===el.dataset.receiptItem);for(const field of $$('[data-ri]',el)){const key=field.dataset.ri;item[key]=key==='checked'?field.checked:['unitCost','qty','salePrice'].includes(key)?num(field.value):field.value;}}}
function openReceiptHistory(){sheet('영수증 입고 기록',`<div class="receipt-history-list">${db.receipts.slice().reverse().map(r=>`<button data-action="receipt-record" data-id="${r.id}">${r.imageData?`<img src="${esc(r.imageData)}" alt="">`:icon('ledger')}<span><strong>${esc(r.supplier||'영수증 입고')}</strong><small>${r.date} · ${r.items.length}종 · ${sum(r.items,i=>i.qty)}개</small></span><b>${won(r.total)}</b>${icon('right')}</button>`).join('')||emptyHTML('영수증 입고 기록이 없어요','영수증을 인식하고 입고하면 여기에서 확인할 수 있습니다.')}</div>`,'<button class="secondary" data-action="receipt-open">영수증 등록</button>',{name:'receipt-history'});}
function openReceiptRecord(id){const r=db.receipts.find(r=>r.id===id);if(!r)return;sheet('영수증 입고 상세',`${r.imageData?`<img class="saved-receipt-image" src="${esc(r.imageData)}" alt="보관한 영수증">`:''}<div class="info-line"><span>입고일</span><strong>${r.date}</strong></div><div class="info-line"><span>구매처</span><strong>${esc(r.supplier||'미등록')}</strong></div>${r.items.map(i=>`<div class="info-line"><span>${esc(i.name)} · ${i.qty}개</span><strong>${won(i.unitCost*i.qty)}</strong></div>`).join('')}<div class="summary-strip"><span>입고 합계</span><strong>${won(r.total)}</strong></div><p class="field-note">비용 ${r.expenseId?'함께 등록 완료':'별도 등록'} · 동일한 사진은 중복 입고하지 않습니다.</p>`,'<button class="secondary" data-action="receipt-history">목록으로</button>',{name:'receipt-record'});}
function rememberPrice(p,price,cost,date){p.price=price;p.lastSalePrice=price;p.cost=cost;p.priceHistory??=[];p.priceHistory.push({date,price,cost});p.priceHistory=p.priceHistory.slice(-20);}
function saveProductSupply(form){const fd=new FormData(form),name=String(fd.get('name')||'').trim(),barcode=String(fd.get('barcode')||'').trim(),price=num(fd.get('price')),cost=num(fd.get('cost')),qty=num(fd.get('qty')),id=modalContext.productId;if(!name)return showError('상품명을 입력해 주세요.');if(!STORE_SUPPLY_CATEGORIES.includes(String(fd.get('category')||db.products.find(x=>x.id===modalContext.productId)?.category||''))&&!price)return showError('판매 상품은 판매가를 입력해 주세요.');if(db.products.some(p=>p.id!==id&&((barcode&&p.barcode===barcode)||p.name===name)))return showError('같은 상품명 또는 바코드가 이미 등록돼 있어요.');const next=structuredClone(db),existing=next.products.find(p=>p.id===id),date=TODAY;let p=existing;if(!p){p={id:uid('p'),color:'#647f60',bg:'#eaf1e3',batches:[],priceHistory:[]};next.products.push(p);}Object.assign(p,{name,barcode,category:String(fd.get('category')),min:num(fd.get('min')),supplier:String(fd.get('supplier')||'')});rememberPrice(p,price,cost,date);if(!existing&&qty)p.batches.push({id:uid('b'),qty,cost,salePrice:price,expiry:String(fd.get('expiry')||''),date,source:'상품 등록'});saveSupplyData(next,'상품을 저장했어요. 다음 입고에 같은 판매가를 불러옵니다.');}
function saveInboundSupply(form){const fd=new FormData(form),qty=num(fd.get('qty')),cost=num(fd.get('cost')),price=num(fd.get('price')),date=String(fd.get('date'));if(!qty)return showError('입고 수량을 입력해 주세요.');if(!STORE_SUPPLY_CATEGORIES.includes(String(fd.get('category')||db.products.find(x=>x.id===modalContext.productId)?.category||''))&&!price)return showError('판매 상품은 판매가를 입력해 주세요.');if(fd.get('addExpense')==='on'&&cost<=0)return showError('비용으로 등록하려면 원가를 입력해 주세요.');const next=structuredClone(db),p=next.products.find(p=>p.id===modalContext.productId);if(!p)return showError('상품을 찾지 못했어요.');p.batches.push({id:uid('b'),qty,cost,salePrice:price,expiry:String(fd.get('expiry')||''),date,source:'입고'});p.supplier=String(fd.get('supplier')||'');rememberPrice(p,price,cost,date);if(fd.get('addExpense')==='on')next.expenses.push({id:uid('e'),date,amount:qty*cost,category:'상품매입',vendor:p.supplier||p.name+' 입고',note:p.name+' '+qty+'개 입고'});saveSupplyData(next,`${p.name} ${qty}개 입고 · 직전 판매가 ${won(price)} 저장`);}
function saveReceiptImport(){syncReceiptFields();const r=supply.receipt,t=receiptReviewTotal();if(!t.items.length)return showError('입고할 품목을 하나 이상 선택해 주세요.');if(!r.date||r.date>TODAY)return showError('입고일을 확인해 주세요.');if(db.receipts.some(x=>x.imageFingerprint&&x.imageFingerprint===r.imageFingerprint))return showError('이미 입고한 영수증입니다.');for(const item of t.items){if(!item.name.trim()||!item.qty||!Number.isInteger(item.qty)||item.qty>100000)return showError('상품명과 수량을 확인해 주세요.');if(!isStoreSupply(item)&&!item.salePrice)return showError(item.name+'의 판매가를 입력해 주세요.');if(!item.unitCost)return showError(item.name+'의 원가를 입력해 주세요.');if(!item.productId&&db.products.some(p=>p.name===item.name))return showError(item.name+'은 이미 있어요. 연결할 상품을 선택해 주세요.');}if(r.total&&r.total!==t.total&&!$('#receipt-adjustment-ok').checked)return showError('영수증 합계와 상품 합계가 달라요. 금액을 수정하거나 할인·추가 비용인지 확인해 주세요.');const newNames=t.items.filter(i=>!i.productId).map(i=>i.name.trim());if(new Set(newNames).size!==newNames.length)return showError('같은 새 상품명이 두 번 있어요. 품목을 합쳐 주세요.');const next=structuredClone(db),saved=[];for(const item of t.items){let p=next.products.find(p=>p.id===item.productId);if(!p){p={id:uid('p'),name:item.name.trim(),barcode:'',category:item.category||'기타',price:item.salePrice,lastSalePrice:item.salePrice,cost:item.unitCost,min:10,supplier:r.supplier,color:'#69815f',bg:'#ecf2e7',batches:[],priceHistory:[]};next.products.push(p);}p.batches.push({id:uid('b'),qty:item.qty,cost:item.unitCost,salePrice:item.salePrice,expiry:item.expiry,date:r.date,source:'영수증',receiptId:r.id});p.supplier=r.supplier||p.supplier;rememberPrice(p,item.salePrice,item.unitCost,r.date);saved.push({...item,productId:p.id,name:p.name});}const addExpense=$('#receipt-add-expense').checked,expenseId=addExpense?uid('e'):'',receiptTotal=r.total||t.total;if(addExpense)next.expenses.push({id:expenseId,date:r.date,amount:receiptTotal,category:'상품매입',vendor:r.supplier||'영수증 상품 입고',note:saved.length+'종 · '+t.qty+'개 · 영수증 입고',receiptId:r.id});next.receipts.push({id:r.id,date:r.date,supplier:r.supplier,total:receiptTotal,itemSubtotal:t.total,adjustment:receiptTotal-t.total,items:saved,imageData:r.imageData,imageFingerprint:r.imageFingerprint,rawText:r.rawText,expenseId});if(saveSupplyData(next,`${saved.length}종 ${t.qty}개 입고${addExpense?' · 비용 '+won(receiptTotal)+' 반영':''}`))supply.receipt=null;}
const actionBeforeStockReceipts=action;
action=function(el){const{action:a,id}=el.dataset;switch(a){case'barcode-open':openBarcodeScanner();return;case'product-barcode-scan':{const form=$('#supply-product-form');openBarcodeScanner(form?Object.fromEntries(new FormData(form)):null);return;}case'barcode-camera':void startBarcodeCamera();return;case'barcode-sample':void decodeBarcodePhoto(assetUrl('assets/sample-barcode.png'));return;case'receipt-open':openReceiptUpload();return;case'receipt-sample':void(async()=>{try{const response=await fetch(assetUrl('assets/sample-receipt.png'));const source=await fileAsDataUrl(await response.blob());await readReceipt(source);}catch(e){showError('예시 영수증을 열지 못했어요.');}})();return;case'receipt-paste':openReceiptPaste();return;case'receipt-add-item':syncReceiptFields();supply.receipt.items.push({id:uid('ri'),name:'새 품목',productId:'',unitCost:0,qty:1,amount:0,salePrice:0,expiry:'',checked:true,warning:''});openReceiptReview();return;case'receipt-history':openReceiptHistory();return;case'receipt-record':openReceiptRecord(id);return;default:return actionBeforeStockReceipts(el);}};

let productionPending=new Map(),lastFinanceRefresh=Date.now(),lastBankRefresh=0;
function mergeProductionRead(next,scope){
 if(scope==='all')return next;
 const fields={finance:['sales','expenses'],settings:['paymentRulesConfigured','paymentRules','paymentClosedDays'],bank:['events','links','payerRules'],stock:['products','receipts']}[scope];
 const flags={finance:['refreshedAt'],settings:['paymentReady','paymentSettingsError'],bank:['bankReady','bankError','truncated','bankStart','bankEnd','refreshedAt'],stock:['stockReady','stockError','imageError']}[scope];
 const merged={...db,connection:{...db.connection}};
 for(const key of fields)merged[key]=next[key];
 for(const key of flags)merged.connection[key]=next.connection[key];
 // Merge settlement metadata independently of the ledger amounts.
 if(scope==='bank'||scope==='finance'){
  const amounts=scope==='bank'?db.sales:next.sales;
  const detail=new Map((scope==='bank'?next.sales:db.sales).map(s=>[s.date,s]));
  merged.sales=amounts.map(s=>{
   const t=detail.get(s.date);if(!t)return s;
   const {card,cash,other,fee,due,settlementKnown}=t;
   return {...s,card,cash,other,fee,due,settlementKnown,settlementConsistent:!settlementKnown||card+cash+other===s.amount};
  });
 }
 return merged;
}
function refreshProduction(silent=false,scope='all'){
 if(productionPending.has(scope))return productionPending.get(scope);
 if(scope==='all')productionRevision++;
 else if(productionPending.has('all'))return productionPending.get('all');
 const run=async()=>{
  if(productionBusy||modalName)return false;
  const revision=productionRevision;
  try{
   const next=await productionBridge.snapshot({scope,base:db});
   if(revision!==productionRevision||productionBusy||modalName)return false;
   if(scope==='finance'||scope==='all')lastFinanceRefresh=Date.now();
   if(scope==='bank'||scope==='all')lastBankRefresh=Date.now();
   // Background data must not disturb typing or rebuild an unrelated page.
   db=mergeProductionRead(next,scope);if(scope==='all'||(scope==='finance'&&['today','ledger','reports'].includes(view.page))||(scope==='settings'&&view.page==='today')||(scope==='stock'&&view.page==='products')||(scope==='bank'&&view.page==='bank'))render();
   if(!silent)toast('최신 내역을 불러왔어요.');
   return true;
  }catch(error){if(!silent||scope===view.page||(scope==='stock'&&view.page==='products'))toast('불러오기 실패: '+error.message);return false;}
 };
 const job=run();
 productionPending.set(scope,job);
 void job.finally(()=>productionPending.delete(scope));
 return job;
}
async function productionWrite(command,payload,message,after){
 if(productionBusy)return false;
 productionBusy=true;productionRevision++;const buttons=$$('.sheet button');buttons.forEach(b=>b.disabled=true);
 try{
  const result=await productionBridge.invoke(command,payload);
  let next;
  try{
   if(command==='sale'&&result?.sale){
    const old=db.sales.find(s=>s.date===result.sale.date);
    const saved={card:0,cash:0,other:0,fee:0,due:'',settlementKnown:false,settlementConsistent:true,...old,...result.sale};
    if(result.warning&&old?.settlementKnown)saved.settlementConsistent=saved.card+saved.cash+saved.other===saved.amount;
    next={...db,sales:[...db.sales.filter(s=>s.date!==saved.date),saved].sort((a,b)=>b.date.localeCompare(a.date))};
   }else if(command==='expense'&&result?.expense){
    const saved=result.expense;next={...db,expenses:[...db.expenses.filter(e=>e.id!==saved.id),saved].sort((a,b)=>b.date.localeCompare(a.date)||Number(b.id)-Number(a.id))};
   }else if(command==='delete'){
    const key=payload.type==='sale'?'sales':'expenses';next={...db,[key]:db[key].filter(row=>String(row.remoteId||row.id)!==String(payload.id))};
   }else{
    const scope=command==='bank'?'bank':command==='payment-rules'?'settings':command==='stocktake'||(command==='stock'&&!payload.document?.addExpense)?'stock':['expense','delete','sale'].includes(command)?'finance':'all';
    next=await productionBridge.snapshot({scope,base:db});
   }
  }
  catch(error){productionClosing=true;closeModal();productionClosing=false;toast('저장은 완료됐지만 최신 내역을 불러오지 못했어요. 설정에서 새로고침해 주세요.');return true;}
  productionClosing=true;closeModal();productionClosing=false;applyProductionSnapshot(next);
  if(result?.warning){sheet('정산정보 확인 필요',`<p>${esc(result.warning)}</p>`,'<button class="secondary" data-action="close-modal">확인</button>',{name:'save-warning'});}
  else{message=productionBridge.isDemo?message.replaceAll('서버에','미리보기에'):message;toast(result?.duplicate?'이미 저장된 요청입니다. 중복 반영하지 않았어요.':message);after?.(result);}
  return true;
 }catch(error){if($('#form-error'))showError(error.message||'서버에 저장하지 못했어요.');else toast(error.message||'서버에 저장하지 못했어요.');return false;}
 finally{productionBusy=false;productionClosing=false;buttons.forEach(b=>b.disabled=false);}
}

/* Touch navigation follows the five visible bottom tabs. */
function installMimineSwipe({root,getPage,navigateTo,isBlocked,isEnabled,now=Date.now}){
 const pages=['today','ledger','reports','bank','products'];
 let gesture=null,suppressClickUntil=0;
 const mainTarget=target=>target?.closest?.('#main');
 function eligible(target){
  if(!mainTarget(target)||target.closest('[data-swipe-ignore],.daily-line-svg,.sheet,.modal-overlay,input,textarea,select,[contenteditable],a'))return false;
  const button=target.closest('button');
  return !button||button.matches('.product-card,.record-row,[data-action="entry"],[data-action="day-detail"]');
 }
 root.addEventListener('touchstart',event=>{
  gesture=null;
  if(event.touches.length!==1||!isEnabled()||isBlocked()||!eligible(event.target))return;
  const t=event.touches[0];gesture={x:t.clientX,y:t.clientY,time:now(),page:getPage(),horizontal:false};
 },{passive:true});
 root.addEventListener('touchmove',event=>{
  if(!gesture)return;
  if(event.touches.length!==1||isBlocked()){gesture=null;return;}
  const t=event.touches[0],dx=Math.abs(t.clientX-gesture.x),dy=Math.abs(t.clientY-gesture.y);
  if(dy>12&&dy>dx){gesture=null;return;}
  if(dx>12&&dx>dy*1.4){gesture.horizontal=true;if(event.cancelable)event.preventDefault();}
 },{passive:false});
 root.addEventListener('touchend',event=>{
  const g=gesture;gesture=null;if(!g||event.touches?.length||isBlocked()||!isEnabled()||g.page!==getPage())return;
  const t=event.changedTouches?.[0];if(!t)return;
  const dx=t.clientX-g.x,dy=t.clientY-g.y,index=pages.indexOf(g.page);
  if(index<0||Math.abs(dx)<60||Math.abs(dx)<=Math.abs(dy)*1.4||now()-g.time>1000)return;
  if(event.cancelable)event.preventDefault();suppressClickUntil=now()+350;
  navigateTo(pages[(index+(dx<0?1:-1)+pages.length)%pages.length]);
 },{passive:false});
 root.addEventListener('touchcancel',()=>{gesture=null;},{passive:true});
 // A swipe that began on a product must not also open the product on release.
 root.addEventListener('click',event=>{
  if(event.detail!==0&&now()<suppressClickUntil&&mainTarget(event.target)){
   event.preventDefault();event.stopImmediatePropagation();
  }
 },true);
}
installMimineSwipe({root:document,getPage:()=>view.page,navigateTo:page=>navigate(page),
 isBlocked:()=>!!modalName||productionBusy,
 isEnabled:()=>window.matchMedia('(max-width:760px)').matches});

/* Keep tabs inside the visible screen when mobile browser controls resize it. */
function installMimineNavViewport({win,doc}){
 const viewport=win.visualViewport;if(!viewport)return;
 const nav=doc.getElementById('mobile-nav');if(!nav)return;
 let inset=0,scheduled=false;
 function update(){
  scheduled=false;
  const editing=doc.activeElement?.matches('input,textarea,select,[contenteditable="true"]');
  const mobile=win.matchMedia('(max-width:760px)').matches;
  // Do not float the menu over the keyboard or a pinch-zoomed page.
  const next=!mobile||editing||Math.abs(viewport.scale-1)>.02?0:
   Math.max(0,Math.round(nav.getBoundingClientRect().bottom+inset-viewport.offsetTop-viewport.height));
  if(next!==inset){inset=next;doc.documentElement.style.setProperty('--mobile-nav-inset',`${inset}px`);}
 }
 function schedule(){if(!scheduled){scheduled=true;win.requestAnimationFrame(update);}}
 viewport.addEventListener('resize',schedule,{passive:true});
 viewport.addEventListener('scroll',schedule,{passive:true});
 win.addEventListener('resize',schedule,{passive:true});
 doc.addEventListener('focusin',schedule);
 doc.addEventListener('focusout',schedule);
 schedule();
}
installMimineNavViewport({win:window,doc:document});

/* Android keeps the layout viewport tall when the software keyboard opens. */
function installMimineDialogViewport({win,doc}){
 const viewport=win.visualViewport;if(!viewport)return;
 let pending=false;
 function update(){
  pending=false;
  if(Math.abs(viewport.scale-1)>.02)return;
  doc.documentElement.style.setProperty('--dialog-visible-height',`${Math.round(viewport.height)}px`);
  doc.documentElement.style.setProperty('--dialog-visible-top',`${Math.round(viewport.offsetTop)}px`);
 }
 function schedule(){if(!pending){pending=true;win.requestAnimationFrame(update);}}
 viewport.addEventListener('resize',schedule,{passive:true});
 viewport.addEventListener('scroll',schedule,{passive:true});
 win.addEventListener('resize',schedule,{passive:true});
 doc.addEventListener('focusin',schedule);
 doc.addEventListener('focusout',schedule);
 schedule();
}
installMimineDialogViewport({win:window,doc:document});
