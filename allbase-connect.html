<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>미미네 · 올베이스 연결</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eff4f8;color:#15304b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:380px;background:white;border:1px solid #e1e9f2;border-radius:23px;padding:30px;box-shadow:0 15px 60px #163a5c09}img{height:53px;width:100px;object-fit:contain;object-position:left}small{font-size:10px;letter-spacing:1.5px;color:#8499ae;display:block;margin-top:22px}h1{font-size:24px;letter-spacing:-.8px;margin:5px 0 8px}p{color:#8091a6;font-size:12px;margin:0 0 22px}label{font-size:12px;color:#59728c;display:block;margin-top:15px;font-weight:600}input{width:100%;padding:12px 13px;margin-top:6px;border:1px solid #dce5ef;border-radius:10px;font:inherit;color:#15304b;background:#fcfdff}input:focus{outline:2px solid #8eb6fa}button{width:100%;background:#225fe9;color:white;border:0;border-radius:11px;padding:13px;margin-top:22px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.message{font-size:12px;padding:12px;border-radius:10px;background:#f1f6fc;color:#6f86a3;line-height:1.8;margin-top:20px}.message.error{background:#fff1f2;color:#ba5665}.safe{font-size:10px;color:#9aabba;text-align:center;margin-top:23px}[hidden]{display:none!important}a{color:#376fce}.back{margin-top:14px;font-size:11px;text-align:center}
  </style>
</head>
<body>
<main class="card">
  <img src="/mimine-face-logo.png" alt="미미네 로고" width="100" height="53">
  <small>ALLBASE CONNECTION</small>
  <h1>미미네 계정 연결</h1>
  <p>기존 계정으로 안전하게 하루를 연결하세요.</p>
  <form id="login" hidden>
    <label for="email">이메일<input type="email" id="email" autocomplete="username" required></label>
    <label for="password">비밀번호<input type="password" id="password" autocomplete="current-password" required></label>
    <button id="submit" type="submit">계정 확인하고 연결</button>
  </form>
  <div id="status" class="message" role="status" aria-live="polite"></div>
  <div class="safe">로그인은 미미네에서 처리합니다.<br>비밀번호는 올베이스로 전달하지 않습니다.</div>
  <div class="back"><a id="app-return" href="/" target="_blank" rel="noopener">기존 앱 열기</a></div>
</main>
<script>
(() => {
  'use strict';
  const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function validLaunchDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const time=Date.parse(value+'T12:00:00Z');
  return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===value;
}
function normalizeLaunchDetails(app,values={}){
  if(!['adw','study'].includes(app))return {};
  const details={},record=values?.record,date=values?.date;
  if(typeof record==='string'&&record.length>0&&record.length<=512&&!/[\u0000-\u001f\u007f]/.test(record)&&!['undefined','null'].includes(record)&&(app!=='adw'||uuid.test(record)))details.record=record;
  if(validLaunchDate(date))details.date=date;
  return details;
}
function launchHash(app,target,values={}){
  const details=normalizeLaunchDetails(app,values),params=new URLSearchParams();
  if(app==='study'){
    if(details.date)params.set('date',details.date);
    if(details.record)params.set('event',details.record);
    if(details.date||details.record)params.set('mode','today');
    return '/#'+encodeURIComponent(target)+(params.size?'?'+params:'');
  }
  params.set('allbase',target);
  for(const [key,value]of Object.entries(details))params.set(key,value);
  return '/#'+params;
}

  // A return to ALLBASE must be bound to a request created in that browser.
// Only ciphertext crosses the return URL; its key stays in ALLBASE storage.
const WORKSPACE_RETURN_PREFIX='#allbase-auth=';
const WORKSPACE_HANDOFF_KEY='allbase.auth.handoff.v1';
const WORKSPACE_HANDOFF_TTL=15*60*1000;
const WORKSPACE_ORIGINS=new Set(['https://allbase.netlify.app','https://allbase.alldayworking.chatgpt.site']);
const NATIVE_APP_ORIGINS=Object.freeze({mimine:'https://mimine-ramyeon.netlify.app',adw:'https://alldayworking.netlify.app'});
const nativeOrigins=new Set(Object.values(NATIVE_APP_ORIGINS));
function returnPath(origin){
  if(WORKSPACE_ORIGINS.has(origin))return '/';
  if(nativeOrigins.has(origin))return '/allbase-connect.html';
  return null;
}
const validNonce=value=>typeof value==='string'&&/^[\w-]{48,128}$/.test(value);
const encoder=new TextEncoder(),decoder=new TextDecoder('utf-8',{fatal:true});
function encode(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(value){if(typeof value!=='string'||!/^[\w-]+$/.test(value)||value.length>180000)throw Error('Invalid handoff');return Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}
function store(name){try{return globalThis[name]}catch{return null}}
function read(storage){try{return JSON.parse(storage?.getItem(WORKSPACE_HANDOFF_KEY)||'null')}catch{return null}}
function valid(input){return input?.v===1&&!!returnPath(input.origin)&&validNonce(input.nonce)&&typeof input.key==='string'&&/^[\w-]{43}$/.test(input.key)&&decode(input.key).length===32}
function aad(origin,nonce){return encoder.encode('allbase:workspace:return:v1:'+origin+':'+nonce)}
async function aes(key,usage,cryptoImpl){return cryptoImpl.subtle.importKey('raw',decode(key),'AES-GCM',false,[usage])}

function readWorkspaceLaunch(origin,nonce,hash){
  try{
    const params=new URLSearchParams(hash.replace(/^#/,''));
    const launch={v:1,origin,nonce,key:params.get('allbase-key')};
    return valid(launch)?launch:null;
  }catch{return null}
}
async function sealWorkspaceReturn(launch,result,cryptoImpl=globalThis.crypto){
  if(!valid(launch))throw Error('Invalid handoff');
  const raw=encoder.encode(JSON.stringify(result));
  if(raw.length>96000)throw Error('Handoff too large');
  const iv=cryptoImpl.getRandomValues(new Uint8Array(12));
  const ciphertext=await cryptoImpl.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad(launch.origin,launch.nonce)},await aes(launch.key,'encrypt',cryptoImpl),raw);
  const envelope={v:1,nonce:launch.nonce,iv:encode(iv),data:encode(ciphertext)};
  return launch.origin+returnPath(launch.origin)+WORKSPACE_RETURN_PREFIX+encode(encoder.encode(JSON.stringify(envelope)));
}

function createWorkspaceHandoff({persistent=store('localStorage'),temporary=store('sessionStorage'),cryptoImpl=globalThis.crypto,now=()=>Date.now()}={}){
  function current(){return read(persistent)||read(temporary)}
  function clear(nonce){
    for(const storage of [persistent,temporary])try{if(!nonce||read(storage)?.nonce===nonce)storage?.removeItem(WORKSPACE_HANDOFF_KEY)}catch{}
  }
  function put(value){
    // One authoritative copy. Duplicating a pending key in sessionStorage would
    // let the original tab replay a return already consumed by a different tab.
    for(const storage of [persistent,temporary])try{
      if(storage){
        storage.setItem(WORKSPACE_HANDOFF_KEY,JSON.stringify(value));
        if(storage===persistent)try{temporary?.removeItem(WORKSPACE_HANDOFF_KEY)}catch{}
        return true;
      }
    }catch{}
    return false;
  }
  function begin(origin,context={}){
    if(!returnPath(origin)||!cryptoImpl?.subtle||!cryptoImpl?.getRandomValues)return null;
    clear();
    const pending={v:1,origin,nonce:cryptoImpl.randomUUID()+cryptoImpl.randomUUID(),key:encode(cryptoImpl.getRandomValues(new Uint8Array(32))),at:now(),context};
    // Persist before navigating away. A popup without an opener can also return
    // in a new tab, which requires the shared localStorage copy.
    return put(pending)?pending:null;
  }
  async function consume(hash,origin){
    if(!hash.startsWith(WORKSPACE_RETURN_PREFIX))return null;
    const envelope=JSON.parse(decoder.decode(decode(hash.slice(WORKSPACE_RETURN_PREFIX.length))));
    const pending=current();
    if(!valid(pending)||pending.origin!==origin||envelope?.v!==1||envelope.nonce!==pending.nonce)throw Error('연결 요청을 확인하지 못했습니다. 올베이스에서 다시 로그인해 주세요.');
    if(!put({nonce:pending.nonce,returned:true}))throw Error('연결 요청을 저장할 수 없습니다.');
    try{
      if(!Number.isFinite(pending.at)||now()<pending.at||now()-pending.at>WORKSPACE_HANDOFF_TTL)throw Error('연결 시간이 지났습니다. 다시 로그인해 주세요.');
      const iv=decode(envelope.iv);
      if(iv.length!==12)throw Error('Invalid handoff');
      const raw=await cryptoImpl.subtle.decrypt({name:'AES-GCM',iv,additionalData:aad(origin,pending.nonce)},await aes(pending.key,'decrypt',cryptoImpl),decode(envelope.data));
      // Logout or a newer attempt in any tab invalidates an in-flight return.
      if(current()?.nonce!==pending.nonce||current()?.returned!==true)throw Error('연결이 취소되었습니다. 다시 로그인해 주세요.');
      return {result:JSON.parse(decoder.decode(raw)),context:pending.context,nonce:pending.nonce,at:pending.at};
    }finally{clear(pending.nonce)}
  }
  return {begin,clear,consume};
}

  const C = {"name": "미미네", "project": "hunoualsfmfckalwbilt", "key": "sb_publishable_DFp-SNqkUWJiX4CHLu_gxQ_FrtXHDwg", "logo": "/mimine-face-logo.png", "targets": ["sales", "expenses", "dashboard", "products", "all"], "id": "mimine"};
  const api = 'https://' + C.project + '.supabase.co/auth/v1/';
  const key = C.key;
  const allowedOrigins = WORKSPACE_ORIGINS;
  const targets = new Set(C.targets);
  const params = new URLSearchParams(location.search);
  const origin = params.get('origin'), nonce = params.get('nonce');
  const intent = params.get('intent') === 'open' ? 'open' : 'connect';
  const unified = params.get('unified') === '1';
  const target = targets.has(params.get('target')) ? params.get('target') : 'dashboard';
  const details = normalizeLaunchDetails(C.id, {record:params.get('record'), date:params.get('date')});
  const form = document.getElementById('login'), button = document.getElementById('submit');
  const status = document.getElementById('status');
  let proven = false, working = false, done = false, ping;

  function message(text, error = false) {
    status.textContent = text;
    status.classList.toggle('error', error);
  }
  function send(type, payload = {}) {
    if (allowedOrigins.has(origin) && window.opener) {
      window.opener.postMessage({type, app:C.id, nonce, ...payload}, origin);
    }
  }
  async function auth(path, body, accessToken) {
    const response = await fetch(api + path, {
      method: body ? 'POST' : 'GET',
      headers: {apikey:key, ...(body ? {'Content-Type':'application/json'} : {}), ...(accessToken ? {Authorization:'Bearer ' + accessToken} : {})},
      body: body ? JSON.stringify(body) : undefined,
      cache:'no-store', signal:AbortSignal.timeout(20000)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(response.status === 400 || response.status === 401
        ? '이메일과 비밀번호를 확인해 주세요.'
        : response.status === 429 ? '요청이 많습니다. 잠시 후 다시 시도해 주세요.' : '로그인 서버에 연결하지 못했습니다.');
      error.status = response.status;
      throw error;
    }
    return data;
  }
  let client;
  function sb() {
    if (!client) client = (async () => {
      if (!globalThis.supabase?.createClient) await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = '/flow/vendor/auth/supabase.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('로그인 모듈을 불러오지 못했습니다.'));
        document.head.append(script);
      });
      return globalThis.supabase.createClient('https://' + C.project + '.supabase.co', key, {auth:{autoRefreshToken:false, detectSessionInUrl:false}});
    })();
    return client;
  }
  function savedNativeSession() {
    try {
      if (C.id === 'mimine') return JSON.parse(localStorage.getItem('sb-' + C.project + '-auth-token') || 'null');
      const access_token = localStorage.getItem('alldayworking_private_token');
      const refresh_token = localStorage.getItem('alldayworking_private_refresh');
      return access_token && refresh_token ? {access_token, refresh_token} : null;
    } catch { return null; }
  }
  async function existingSession() {
    if (C.id === 'mimine') {
      const {data, error} = await (await sb()).auth.getSession();
      if (error) throw error;
      return data.session;
    }
    return savedNativeSession();
  }
  function claims(session) {
    try {
      const payload = session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(payload));
    } catch { return {}; }
  }
  function expiry(session) {
    return Number(session.expires_at) || Number(claims(session).exp) || 0;
  }
  async function rememberNativeSession(session) {
    if (C.id === 'mimine') {
      const saved = await (await sb()).auth.setSession(session);
      if (saved.error) throw saved.error;
    } else {
      localStorage.setItem('alldayworking_private_token', session.access_token);
      localStorage.setItem('alldayworking_private_refresh', session.refresh_token);
    }
  }
  async function accept(session, expected) {
    if (!session?.access_token || !session?.refresh_token) throw new Error('계정 연결 정보를 확인해 주세요.');
    let fresh = session, user;
    try { user = await auth('user', null, fresh.access_token); }
    catch (error) {
      if (error.status !== 401) throw error;
      fresh = await auth('token?grant_type=refresh_token', {refresh_token:fresh.refresh_token});
      user = await auth('user', null, fresh.access_token);
    }
    if (!user?.id) throw new Error('로그인 상태를 다시 확인해 주세요.');
    if (expected && (user.id !== expected.id || user.email?.trim().toLowerCase() !== expected.email?.trim().toLowerCase())) throw new Error('올베이스 계정으로 다시 연결해 주세요.');
    // JWT expiry is scheduling metadata only; the Auth server above verifies identity.
    const expires_at = expiry(fresh);
    await rememberNativeSession({...fresh, expires_at});
    return {...fresh, expires_at, user:{id:user.id, email:user.email}};
  }
  function returnLink(hub) {
    const link = document.getElementById('app-return');
    link.href = allowedOrigins.has(hub) ? hub : 'https://allbase.netlify.app';
    link.removeAttribute('target');
    link.textContent = '올베이스로 돌아가기';
  }
  function isCurrentSession(session, expectedUser) {
    // This only selects a navigation path. The app verifies identity and access
    // before displaying data, just as it does on an ordinary revisit.
    const token = claims(session);
    return Boolean(expectedUser && session?.refresh_token && token.sub === expectedUser && Number.isFinite(token.exp) && token.exp > Date.now()/1000 + 30);
  }
  async function restoreNativeSession(context) {
    const {account, expectedUser, target, details} = context;
    let saved = savedNativeSession();
    if (!isCurrentSession(saved, expectedUser) && expectedUser && claims(saved).sub === expectedUser && saved?.refresh_token) {
      try {
        const renewed = C.id === 'mimine' ? await existingSession() : await auth('token?grant_type=refresh_token', {refresh_token:saved.refresh_token});
        if (isCurrentSession(renewed, expectedUser)) {
          if (C.id === 'adw') await rememberNativeSession(renewed);
          saved = renewed;
        }
      } catch (error) {
        if (![400, 401, 403].includes(error.status)) throw error;
      }
    }
    if (isCurrentSession(saved, expectedUser)) { location.replace(launchHash(C.id, target, details)); return; }
    // Study's own first-party cookie can issue a separate session for this app.
    const handoff = createWorkspaceHandoff().begin(location.origin, context);
    if (!handoff) throw new Error('이 탭에 연결 정보를 저장하지 못했습니다.');
    const url = new URL('/allbase-workspace.html', 'https://alldaystudy.netlify.app');
    url.search = new URLSearchParams({origin:location.origin, nonce:handoff.nonce, transport:'redirect', app:C.id, account});
    url.hash = new URLSearchParams({'allbase-key':handoff.key});
    location.replace(url.toString());
  }
  async function receiveNativeSession(hash) {
    history.replaceState(null, '', '/allbase-connect.html');
    const returned = await createWorkspaceHandoff().consume(hash, location.origin);
    const {result, context} = returned;
    returnLink(context.hub);
    if (result.error === 'LOGIN_REQUIRED' || result.error === 'ACCOUNT_MISMATCH') {
      message('연결한 올베이스 계정으로 다시 로그인해 주세요.', true);
      return;
    }
    if (result.error || result.cancelled) {
      message('앱 연결을 확인하지 못했습니다. 올베이스에서 앱을 다시 열어 주세요.', true);
      return;
    }
    const session = result.session;
    if (result.account?.id !== context.account || !uuid.test(session?.user?.id || '') ||
        (context.expectedUser && session.user.id !== context.expectedUser) ||
        !isCurrentSession(session, session.user.id)) throw new Error('계정 연결 정보를 확인하지 못했습니다.');
    if (!isCurrentSession(savedNativeSession(), session.user.id)) await rememberNativeSession(session);
    location.replace(launchHash(C.id, context.target, context.details));
  }
  if (location.origin === NATIVE_APP_ORIGINS[C.id] && location.hash?.startsWith(WORKSPACE_RETURN_PREFIX)) {
    returnLink();
    void receiveNativeSession(location.hash).catch(() => message('앱 연결을 확인하지 못했습니다. 올베이스에서 다시 열어 주세요.', true));
    return;
  }
  if (params.get('transport') === 'redirect' && intent === 'open') {
    returnLink(origin);
    const account = params.get('account'), expectedUser = params.get('user');
    if (location.origin !== NATIVE_APP_ORIGINS[C.id] || !allowedOrigins.has(origin) || !uuid.test(account || '') || (expectedUser && !uuid.test(expectedUser))) {
      message('올베이스에서 앱을 열어 주세요.', true);
      return;
    }
    message('저장된 로그인 상태를 확인하고 있습니다.');
    void restoreNativeSession({hub:origin, account, expectedUser, target, details}).catch(error => message(error.message || '앱 연결을 확인하지 못했습니다.', true));
    return;
  }
  async function finish(session, expected) {
    const fresh = await accept(session, expected);
    done = true;
    form.hidden = true;
    if (intent === 'open') {
      send('allbase:updated', {session:fresh});
      history.replaceState(null, '', '/allbase-connect.html');
      location.replace(launchHash(C.id, target, details));
    } else {
      send('allbase:connected', {session:fresh});
      message('계정을 연결했습니다. 올베이스로 돌아갑니다.');
      setTimeout(() => window.close(), 700);
    }
  }
  function requireWorkspace() {
    done = true;
    form.hidden = true;
    message('올베이스 통합 연결에서 계정을 확인하고 있습니다.');
    send('allbase:workspace-required');
  }
  async function connectExisting(preferred) {
    if (working || done) return;
    working = true;
    try {
      const session = preferred || await existingSession();
      if (session) {
        try { await finish(session, unified ? preferred?.user : null); }
        catch (error) {
          // The original app may have rotated its session since the hub last opened.
          const native = preferred ? await existingSession() : null;
          if (!native || native.access_token === session.access_token) throw error;
          await finish(native, unified ? preferred?.user : null);
        }
      }
      else if (unified) requireWorkspace();
      else { form.hidden = false; message(C.name + '의 기존 계정으로 로그인해 주세요.'); }
    } catch {
      if (unified) { requireWorkspace(); return; }
      form.hidden = false;
      message('로그인 상태를 확인하려면 기존 계정으로 로그인해 주세요.');
    } finally { working = false; }
  }
  window.addEventListener('message', async event => {
    if (!allowedOrigins.has(origin) || !/^[\w-]{48,128}$/.test(nonce || '') || !window.opener || event.origin !== origin || event.source !== window.opener || event.data?.nonce !== nonce || event.data?.app !== C.id) return;
    if (!['allbase:request', 'allbase:session'].includes(event.data.type) || working || done) return;
    proven = true;
    clearInterval(ping);
    await connectExisting(event.data.type === 'allbase:session' && intent === 'open' ? event.data.session : null);
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!proven || working || done) return;
    if (unified) { requireWorkspace(); return; }
    working = true;
    button.disabled = true;
    message('계정을 확인하고 있습니다.');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      const session = await auth('token?grant_type=password', {email, password});
      document.getElementById('password').value = '';
      await finish(session);
    } catch (error) { message(error.message, true); }
    finally { document.getElementById('password').value = ''; working = false; button.disabled = false; }
  });
  if (!allowedOrigins.has(origin) || !/^[\w-]{48,128}$/.test(nonce || '') || !window.opener) {
    message('올베이스의 내 앱 메뉴에서 계정 연결을 시작해 주세요.', true);
    return;
  }
  message('올베이스와 안전하게 연결하고 있습니다.');
  send('allbase:ready');
  ping = setInterval(() => { if (!proven) send('allbase:ready'); }, 500);
  setTimeout(() => {
    clearInterval(ping);
    if (!proven) message('연결 요청을 확인하지 못했습니다. 올베이스에서 다시 시작해 주세요.', true);
  }, 15000);
})();
</script>
</body>
</html>
