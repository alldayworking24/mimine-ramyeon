<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미미네 수정본 · 로컬 검증</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8eae6;color:#263431;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff}header strong{margin-right:12px}button,select,a{padding:9px 12px;background:white;color:inherit;border:1px solid #d5dcd7;border-radius:9px;font:inherit}button{cursor:pointer}a{text-decoration:none}.warning{font-size:12px;padding:9px;text-align:center;background:#fff4d8;color:#745a2c}#stage{display:flex;justify-content:center;padding:20px}iframe{width:390px;height:844px;max-width:100%;border:0;border-radius:18px;outline:6px solid #fff;box-shadow:0 10px 40px #23332117}#log{max-width:1100px;padding:12px;margin:auto;font-size:12px;overflow-wrap:anywhere}@media(max-width:700px){header strong{display:none}#stage{padding:12px}iframe{height:calc(100dvh - 160px)}}
</style>
<header><strong>미미네 · 수정본 검증</strong><select id="size" aria-label="화면 너비"><option value="360">휴대폰 360px</option><option value="390" selected>휴대폰 390px</option><option value="412">휴대폰 412px</option><option value="1240">PC 1240px</option></select><button id="incoming">가상 입금 수신</button><button id="failure">다음 저장 실패 체험</button><a href="assets/sample-receipt.png" download>예시 영수증</a><a href="assets/sample-barcode.png" download>예시 바코드</a></header>
<div class="warning">가상 데이터로 검증하는 화면입니다. 실제 은행·운영 DB에는 연결하지 않습니다.</div>
<div id="stage"><iframe id="app-frame" title="미미네 수정본 검증" allow="camera"></iframe></div><p id="log" role="status"></p>
<script src="payment-core.js"></script><script src="preview-provider.js"></script><script src="mock-bridge.js"></script>
