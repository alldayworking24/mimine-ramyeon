<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미미네 · 매출 입력 목업</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8edf1;font:14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#30404c}header{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;background:white}header span{font-size:11px;color:#74808e}button{font:inherit;cursor:pointer}#device{width:390px;height:844px;max-width:100%;margin:12px auto;display:flex;flex-direction:column;background:white;border-radius:18px;overflow:hidden;outline:4px solid #fff;box-shadow:0 12px 40px #20374b20}iframe{width:100%;flex:1;min-height:0;border:0}#keyboard{height:280px;flex:0 0 280px;background:#e1e5e9;border-top:1px solid #c8d0d8;padding:6px 8px 12px}#keyboard[hidden]{display:none}.key-caption{text-align:center;color:#66727f;font-size:10px;height:24px;line-height:24px}.keys{height:230px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,1fr);gap:6px}.keys button{background:#fff;border:0;border-radius:7px;font-size:24px;color:#23323f;box-shadow:0 1px 1px #7a869a38}.keys button:last-child{font-size:14px;background:#cbd8eb;color:#205696}.keys button[data-key="hide"]{font-size:16px;background:transparent}.note{font-size:11px;color:#6b7884;text-align:center;margin:12px} </style>
<header><strong>미미네 · 수정 목업</strong><span>가상 데이터 / 키보드 모형</span></header><div id="device"><iframe id="app-frame" title="미미네 매출 입력" allow="camera"></iframe><section id="keyboard" aria-label="숫자 키보드 모형" hidden><div class="key-caption">숫자 키보드 모형 · 저장은 입력칸 옆에서</div><div class="keys"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="hide">⌄</button><button data-key="0">0</button><button data-key="delete">지우기</button></div></section></div><p class="note">실제 운영 데이터는 변경하지 않습니다.</p>
<script src="preview-provider.js"></script><script>
window.MimineBridge=createMiminePreviewProvider();const frame=document.getElementById('app-frame'),keyboard=document.getElementById('keyboard');frame.src='../index.html#ledger';let replaceAmount=true;
frame.addEventListener('load',()=>{const doc=frame.contentDocument;doc.addEventListener('focusin',e=>{if(e.target.id==='entry-amount'){keyboard.hidden=false;replaceAmount=true;}});new MutationObserver(()=>{if(!doc.getElementById('entry-form'))keyboard.hidden=true;}).observe(doc.getElementById('modal-root'),{childList:true});});
keyboard.addEventListener('pointerdown',e=>e.preventDefault());keyboard.addEventListener('click',e=>{const key=e.target.closest('[data-key]')?.dataset.key,input=frame.contentDocument.getElementById('entry-amount');if(!input||!key)return;if(key==='hide'){keyboard.hidden=true;input.blur();return;}const raw=input.value.replace(/\D/g,'');input.value=key==='delete'?raw.slice(0,-1):replaceAmount?key:raw+key;replaceAmount=false;input.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));});
</script></html>
